<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Defterhane</title>
<meta name="description" content="Hafızası olan tarihî rol yapma motoru. Anlatıcı anlatır; zar, kayıt ve kural motorda durur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,600;1,400&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deniz:#0a141d; --deniz2:#0f1e2a; --deniz3:#152a39; --cizgi:#23394a;
  --yazi:#d9e0e4; --soluk:#8fa3b0;
  --pirinc:#c9a24a; --fener:#f0c566; --verdigri:#5aa894;
  --kagit:#e9e5da; --kagit2:#dcd6c6; --murekkep:#1c232a; --kagit-soluk:#5b6570;
  --kayip:#8a1c1c; --kazanc:#2d6e58;
  --hata:#b3261e;
  --serif:"Vollkorn","Gentium Book Plus",Georgia,"Times New Roman",serif;
  --sans:"Fira Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deniz);color:var(--yazi);font-family:var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fener);outline-offset:2px}
.gizli{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:fixed;left:0;top:0;width:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;overflow:clip}

/* ---------- başlık ---------- */
header{display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem;background:var(--deniz2);border-bottom:1px solid var(--cizgi);min-width:0}
.marka{font-family:var(--serif);font-weight:600;font-size:1.2rem;color:var(--fener);letter-spacing:.04em;white-space:nowrap}
.kunye{min-width:0;flex:1;font-size:.8rem;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kunye b{color:var(--yazi);font-weight:500}
nav.ust{display:flex;gap:.35rem;flex-shrink:0}
.dg{background:transparent;border:1px solid var(--cizgi);color:var(--yazi);padding:.38rem .7rem;border-radius:3px;cursor:pointer;font-size:.85rem;line-height:1.2;white-space:nowrap}
.dg:hover{border-color:var(--pirinc);color:var(--fener)}
.dg.ana{background:var(--pirinc);border-color:var(--pirinc);color:#1a1405;font-weight:600}
.dg.ana:hover{background:var(--fener);color:#1a1405}
.dg.uyari{border-color:var(--hata);color:#ffb4ab}
.dg[disabled]{opacity:.5;cursor:not-allowed}
.dg.kucuk{padding:.25rem .55rem;font-size:.78rem}
#dg-durum{display:none}

/* ---------- gövde ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
#akis{overflow-y:auto;overscroll-behavior:contain;padding:1.25rem 1rem 2rem;min-height:0}
#panel{overflow-y:auto;overscroll-behavior:contain;min-height:0;background:var(--deniz2);border-left:1px solid var(--cizgi);padding:1rem 1rem 2rem}

/* ---------- sahne akışı ---------- */
.yaprak{max-width:54rem;margin:0 auto 1.1rem}
.sahne{display:grid;grid-template-columns:8.75rem minmax(0,1fr);background:var(--kagit);color:var(--murekkep);border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}
.hamis{border-right:1px solid var(--kagit2);padding:1rem .8rem;font-size:.76rem;line-height:1.45;color:var(--kagit-soluk);display:flex;flex-direction:column;gap:.35rem}
.hamis .t{font-weight:600;color:var(--murekkep)}
.hamis .zar{font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--murekkep)}
.hamis .arti{color:var(--kazanc);font-weight:500}
.hamis .eksi{color:var(--kayip);font-weight:500}
.hamis .notr{color:var(--murekkep)}
.hamis .not{font-style:italic;color:var(--kagit-soluk);border-top:1px dotted var(--kagit2);padding-top:.3rem}
.metin{padding:1.15rem 1.5rem 1.25rem;font-family:var(--serif);font-size:1.08rem;line-height:1.62;overflow-wrap:anywhere}
.metin p{margin:0 0 .8em}
.metin p:last-child{margin-bottom:0}
.sahne-alt{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.35rem}
.alt-dg{background:none;border:0;color:var(--soluk);font-size:.78rem;cursor:pointer;padding:.25rem .4rem;text-decoration:underline;text-underline-offset:3px}
.alt-dg:hover{color:var(--fener)}
.hamle{max-width:54rem;margin:0 auto 1.1rem;padding:.55rem .9rem;border-left:3px solid var(--pirinc);background:var(--deniz2);font-family:var(--serif);font-style:italic;font-size:1.02rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.hamle .kim{display:block;font-family:var(--sans);font-style:normal;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pirinc);margin-bottom:.2rem}
.hata-kutu{max-width:54rem;margin:0 auto 1.1rem;padding:.8rem 1rem;border:1px solid var(--hata);background:rgba(179,38,30,.15);color:#ffd9d4;border-radius:2px;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tohum{max-width:54rem;margin:0 auto 1.1rem;border:1px solid var(--cizgi);background:var(--deniz2);border-radius:2px}
.tohum summary{cursor:pointer;padding:.6rem .9rem;color:var(--soluk);font-size:.85rem}
.tohum ol{margin:0;padding:.2rem 1.2rem 1rem 2.4rem;font-family:var(--serif);font-size:.95rem;line-height:1.5}
.tohum li{margin:.35rem 0}
.tohum li span{color:var(--pirinc);font-family:var(--sans);font-size:.75rem}
.acilis{max-width:40rem;margin:2rem auto;text-align:center;color:var(--soluk);font-family:var(--serif);font-size:1.05rem;line-height:1.6}
.imlec::after{content:"▍";color:var(--kagit-soluk);animation:yanip 1s steps(1) infinite}
@keyframes yanip{50%{opacity:0}}
.itiraz{max-width:54rem;margin:-.4rem auto 1.1rem;padding:.75rem .9rem;background:var(--deniz3);border:1px solid var(--cizgi);border-radius:2px;display:grid;gap:.5rem}
.itiraz label{font-size:.8rem;color:var(--soluk)}
.itiraz .oneri{font-family:var(--serif);font-size:1rem;color:var(--fener)}
.satir{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* ---------- durum paneli ---------- */
.p-bas{font-family:var(--serif);font-size:1.15rem;color:var(--fener);margin:0 0 .15rem}
.p-alt{font-size:.8rem;color:var(--soluk);margin:0 0 .9rem;line-height:1.4}
.p-kisim{margin:0 0 1rem}
.p-kisim h3{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--verdigri);margin:0 0 .4rem;font-weight:600}
.p-kisim ul{list-style:none;margin:0;padding:0}
.p-kisim li{font-size:.84rem;line-height:1.4;padding:.22rem 0;border-bottom:1px solid rgba(35,57,74,.6)}
.p-kisim li:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:.75rem}
.kv span:first-child{color:var(--soluk)}
.kv span:last-child{text-align:right}
.sayi-buyuk{font-family:var(--serif);font-size:1.6rem;color:var(--fener);font-variant-numeric:tabular-nums}
.cubuk{display:grid;grid-template-columns:minmax(0,1fr) 2.2rem;gap:.1rem .5rem;align-items:center}
.cubuk .ad{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cubuk .deger{font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--soluk)}
.cubuk .iz{grid-column:1/-1;height:3px;background:var(--deniz3);border-radius:2px;overflow:hidden}
.cubuk .iz i{display:block;height:100%;background:var(--pirinc)}
li.yeni{background:linear-gradient(90deg,rgba(90,168,148,.18),transparent)}
.olu{color:var(--soluk);text-decoration:line-through;text-decoration-color:rgba(143,163,176,.5)}
.p-not{font-size:.74rem;color:var(--soluk);border-top:1px solid var(--cizgi);padding-top:.6rem;margin-top:1.2rem;line-height:1.4}

/* ---------- giriş şeridi ---------- */
footer#giris{background:var(--deniz2);border-top:1px solid var(--cizgi);padding:.6rem .9rem calc(.55rem + env(safe-area-inset-bottom))}
.giris-ust{display:flex;gap:.6rem;align-items:flex-end;max-width:72rem;margin:0 auto}
#hamle{flex:1;min-width:0;resize:none;font-size:16px;line-height:1.45;padding:.6rem .75rem;background:var(--deniz);border:1px solid var(--cizgi);border-radius:3px;max-height:30vh;font-family:var(--serif)}
#hamle:focus{border-color:var(--pirinc);outline:none}
#gonder{padding:.62rem 1.1rem}
.giris-alt{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;max-width:72rem;margin:.4rem auto 0;font-size:.8rem;color:var(--soluk)}
.giris-alt label{display:flex;gap:.35rem;align-items:center;cursor:pointer}
.giris-alt select{background:var(--deniz);border:1px solid var(--cizgi);border-radius:3px;padding:.1rem .3rem;font-size:.8rem}
#son-zar{font-variant-numeric:tabular-nums;color:var(--yazi)}
#erisim-bilgi{margin-left:auto}

/* ---------- çekmeceler ---------- */
.ortu{position:absolute;inset:0;background:rgba(3,8,12,.6);z-index:30}
.cekmece{position:absolute;top:0;right:0;height:100%;width:min(100%,30rem);background:var(--deniz2);border-left:1px solid var(--cizgi);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr) auto;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.cekmece.acik{transform:none;visibility:visible;transition:transform .22s ease}
.c-bas{padding:.8rem 1rem;border-bottom:1px solid var(--cizgi);display:grid;gap:.6rem}
.c-bas .ust{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.c-bas h2{margin:0;font-family:var(--serif);font-size:1.15rem;color:var(--fener);font-weight:600}
.c-govde{overflow-y:auto;overscroll-behavior:contain;padding:.8rem 1rem 1.2rem;min-height:0}
.c-alt{padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi);display:flex;gap:.5rem;flex-wrap:wrap}
.c-govde h3{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--verdigri);margin:1.1rem 0 .5rem}
.c-govde h3:first-child{margin-top:0}
.alan{width:100%;background:var(--deniz);border:1px solid var(--cizgi);border-radius:3px;padding:.5rem .6rem;font-size:16px;line-height:1.4}
textarea.alan{resize:vertical;min-height:4.5rem}
.alan:focus{border-color:var(--pirinc);outline:none}
.kaide-l{list-style:none;margin:0;padding:0;counter-reset:k}
.kaide-l li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.4rem;padding:.55rem 0;border-bottom:1px solid var(--cizgi);counter-increment:k}
.kaide-l li::before{content:counter(k) ".";color:var(--pirinc);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:.1rem}
.kaide-l .mt{font-family:var(--serif);font-size:.98rem;line-height:1.45}
.kaide-l .ek{display:flex;gap:.4rem;align-items:center;margin-top:.3rem;flex-wrap:wrap}
.cip{font-size:.68rem;border:1px solid var(--cizgi);border-radius:2px;padding:.05rem .35rem;color:var(--soluk)}
.cip.duzeltme{border-color:var(--verdigri);color:var(--verdigri)}
.ikaz{background:rgba(201,162,74,.12);border:1px solid var(--pirinc);color:var(--fener);padding:.5rem .7rem;border-radius:2px;font-size:.85rem}
.kanon-l{list-style:none;margin:0;padding:0}
.kanon-l li{padding:.5rem 0;border-bottom:1px solid var(--cizgi);font-size:.88rem;line-height:1.45}
.kanon-l .ust{display:flex;justify-content:space-between;gap:.5rem;color:var(--soluk);font-size:.74rem}
.kanon-l .et{color:var(--verdigri);font-size:.72rem}
.form-s{display:grid;gap:.35rem;margin-bottom:.7rem}
.form-s label{font-size:.8rem;color:var(--soluk)}
.radyo{display:grid;gap:.4rem;font-size:.9rem}
.radyo label{display:flex;gap:.5rem;align-items:flex-start;cursor:pointer}
.aciklama{font-size:.78rem;color:var(--soluk);line-height:1.45;margin:.2rem 0 .6rem}

#bildirim{position:absolute;left:50%;bottom:6.5rem;transform:translateX(-50%);background:var(--deniz3);border:1px solid var(--pirinc);color:var(--yazi);padding:.55rem .9rem;border-radius:3px;font-size:.85rem;z-index:60;max-width:calc(100% - 2rem);box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* ---------- dar ekran ---------- */
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)}
  #panel{position:absolute;top:0;right:0;height:100%;width:min(88%,22rem);z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;border-left:1px solid var(--cizgi)}
  #panel.acik{transform:none;visibility:visible;transition:transform .22s ease}
  #dg-durum{display:inline-block}
  .sahne{grid-template-columns:minmax(0,1fr)}
  .hamis{border-right:0;border-bottom:1px solid var(--kagit2);flex-direction:row;flex-wrap:wrap;gap:.2rem .8rem;padding:.55rem .9rem}
  .hamis .not{border-top:0;padding-top:0}
  .metin{padding:1rem 1rem 1.1rem;font-size:1.04rem}
  #akis{padding:1rem .75rem 1.5rem}
  .kunye{display:none}
  header{gap:.5rem;padding:.5rem .6rem}
  nav.ust{flex:1;justify-content:flex-end;flex-wrap:wrap}
  .dg{padding:.35rem .5rem;font-size:.8rem}
  #erisim-bilgi{margin-left:0}
}
@media (max-width:420px){ .marka{font-size:1rem} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="marka">Defterhane</span>
    <span class="kunye" id="kunye"></span>
    <nav class="ust" aria-label="Ana düğmeler">
      <button class="dg" id="dg-durum" type="button" aria-controls="panel">Durum</button>
      <button class="dg" type="button" data-cekmece="c-kaide">Kaide</button>
      <button class="dg" type="button" data-cekmece="c-kanon">Kanon</button>
      <button class="dg" type="button" id="dg-disa">Dışa aktar</button>
      <button class="dg" type="button" data-cekmece="c-ayar">Ayar</button>
    </nav>
  </header>

  <main>
    <section id="akis" aria-label="Sahne akışı" aria-live="polite"></section>
    <aside id="panel" aria-label="Durum paneli"></aside>
  </main>

  <footer id="giris">
    <form class="giris-ust" id="giris-form" autocomplete="off">
      <label for="hamle" class="sr">Hamlen</label>
      <textarea id="hamle" rows="2" placeholder="Hamleni yaz… (Ctrl/Cmd + Enter ile gönder)"></textarea>
      <button class="dg ana" id="gonder" type="submit">Gönder</button>
    </form>
    <div class="giris-alt">
      <label><input type="checkbox" id="zar-at"> zar at</label>
      <span id="son-zar" title="Son atılan zar">d20 · —</span>
      <label>derinlik
        <select id="derinlik">
          <option value="hizli">hızlı</option>
          <option value="normal">normal</option>
          <option value="derin">derin</option>
        </select>
      </label>
      <span id="erisim-bilgi"></span>
    </div>
  </footer>

  <div class="ortu gizli" id="ortu"></div>

  <!-- KAİDE -->
  <section class="cekmece" id="c-kaide" role="dialog" aria-modal="true" aria-labelledby="c-kaide-b">
    <div class="c-bas">
      <div class="ust"><h2 id="c-kaide-b">Kaide</h2><button class="dg kucuk" type="button" data-kapat>Kapat</button></div>
      <form id="kaide-ekle" class="satir">
        <label for="kaide-yeni" class="sr">Yeni kaide</label>
        <textarea id="kaide-yeni" class="alan" rows="2" placeholder="Yeni kural (emir kipinde, kısa, denetlenebilir)"></textarea>
        <button class="dg ana" type="submit">Ekle</button>
      </form>
    </div>
    <div class="c-govde" id="kaide-govde"></div>
    <div class="c-alt"><span class="aciklama" id="kaide-say" style="margin:0"></span></div>
  </section>

  <!-- KANON -->
  <section class="cekmece" id="c-kanon" role="dialog" aria-modal="true" aria-labelledby="c-kanon-b">
    <div class="c-bas"><div class="ust"><h2 id="c-kanon-b">Kanon</h2><button class="dg kucuk" type="button" data-kapat>Kapat</button></div></div>
    <div class="c-govde" id="kanon-govde"></div>
    <div class="c-alt">
      <button class="dg" type="button" id="dg-son-sil">Son turu sil</button>
      <button class="dg" type="button" id="dg-sahne-sil">Sahneleri sil, kaide kalsın</button>
      <button class="dg" type="button" id="dg-sifirla">Her şeyi sıfırla</button>
    </div>
  </section>

  <!-- AYAR -->
  <section class="cekmece" id="c-ayar" role="dialog" aria-modal="true" aria-labelledby="c-ayar-b">
    <div class="c-bas"><div class="ust"><h2 id="c-ayar-b">Ayar</h2><button class="dg kucuk" type="button" data-kapat>Kapat</button></div></div>
    <div class="c-govde" id="ayar-govde"></div>
    <div class="c-alt">
      <button class="dg" type="button" id="dg-json-al">Yedek al (JSON)</button>
      <label class="dg" for="json-yukle" style="display:inline-block">Yedek yükle</label>
      <input type="file" id="json-yukle" accept="application/json,.json" class="sr">
    </div>
  </section>

  <div id="bildirim" class="gizli" role="status"></div>
</div>

<script>
'use strict';
/* =====================================================================
   DEFTERHANE — tek dosya. Anlatıcı yalnız anlatır; zar, kayıt ve kural
   motordadır. Dört kayıt: KAİDE · SÖZLÜK · DURUM · KANON.
   ===================================================================== */

const DEPO_ANAHTARI = 'defterhane.v1';
const API_ANAHTARI = 'defterhane.api-anahtari';
const BAGLAM_BUTCESI = 60000;
const KAIDE_SINIRI = 35;
const ITIBAR_SINIRI = 15;

/* ---------------------------------------------------------------------
   TOHUM VERİ — Balaban Vekâyinâmesi ve şartname §10, Ek A–E
   --------------------------------------------------------------------- */

const TOHUM_KAIDE = [
  // 10.1 Dönem ve doğruluk
  'Tarihî olaylar, isimler, tarihler ve kurumlar uydurulmaz. Bilinmeyen yerde boşluk bırakılır, doldurulmaz.',
  'Vakit ölçüsü: ezan, kum saati, vardiya, güneşin yeri. Saat–dakika–saniye yok, kol saati yok.',
  'Hitap ve rütbe doğru kullanılır: reis ≠ paşa. Paşa yalnız vezir ve beylerbeyi içindir.',
  'Kurum, ceza ve usul döneme uygun olacak. Ceza merdiveni: tevbih → azl → habs/kalebend → müsadere → siyaset.',
  'Anakronik terim yasaktır: yaver, teğmen, personel, motivasyon, stres, sistem, proje, dakika, saniye.',
  // 10.2 Anlatım
  'Sahneler insan insana geçer: konuşma, tasvir, koku, ses, hava. Oyun etiketleri (kriz · fırsat · görev) metnin içine serpiştirilmez.',
  'Her cengin ağırlığı, kanı ve bedeli gösterilir. Zafer ucuz yazılmaz.',
  'Oyuncunun hamlesi uygulanır; onun yerine karar verilmez. Karakter, oyuncunun yazmadığı bir şeyi yapmaz.',
  'Sahne oyuncuya bir karar bırakarak biter. Anlatıcı sahneyi kendi kapatmaz.',
  'Övgü ucuz dağıtılmaz. Kimse kahraman ilan edilmez.',
  // 10.3 Karakter tutarlılığı
  'Karakterin bedenî vasıfları ve yaraları durumda yazılıdır; sahne bunları yok saymaz.',
  'Karakterin sertliği bir kusur değil bir vasıftır. Kurduğu otoriteyi özür dileyerek geri vermez.',
  'Zimmetlenen tekneler, adamlar ve hatlar unutulmaz.',
  'Emir zinciri tutarlı kalır. Kaldırılmış bir vazife ikinci kere verilmez; olmayan bir âmir atanmaz.',
  // 10.4 Vaatler ve borçlar
  'Vaat edilen şey (rütbe, in\'âm, gemi, emanet) şartlarıyla beraber hatırlanır. Şart tutulmadan verilmez, tutulunca da geciktirilmez.',
  'Emanetler ve açık meseleler kendiliğinden çözülmez; oyuncu onlara dokunana kadar beklerler.',
  // 10.5 Ölüm ve sonuç
  'Ölen ölür. Diriltme yoktur.',
  'Anlatıcı oyuncunun karakterini kendi başına öldürmez. Ölüm ancak şu üçü birlikteyse gelir: oyuncunun kendi kararı + kötü zar + durumda yazılı bir zafiyet.',
  'Yan karakter ölümü bedava değildir; sebebi zincirlenebilir olmalıdır.',

function h(tag, props, ...cocuk) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of cocuk.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}

function kacis(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* Türkçe duyarlı sadeleştirme: küçük harf, düzeltme işaretleri ve Türkçe harfler atılır. */
function sade(s) {
  return String(s).toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’'`]/g, "'").replace(/\s+/g, ' ').trim();
}
/* Liste öğesinin anahtarı: " — " öncesindeki kısım. */
function anahtar(s) { return sade(String(s).split(/\s+[—–-]\s+/)[0]); }

function sahneHtml(metin) {
  return String(metin).trim().split(/\n\s*\n/).map(p => {
    let t = kacis(p.trim()).replace(/\n/g, '<br>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>');
    return `<p>${t}</p>`;
  }).join('');
}

function isaret(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '±0'; }

function oyuncuVeGmKayitlari() { return S.kanon.filter(k => k.rol !== 'tohum'); }

/* Son N turun kayıtlarını (hamle + sahne) döndürür; güncel hamle hariç. */
function sonTurlar(haric, n) {
  const kayit = oyuncuVeGmKayitlari().filter(k => k !== haric && !(k.rol === 'oyuncu' && k.hata && k !== haric));
  const sonuc = []; let tur = 0;
  for (let i = kayit.length - 1; i >= 0 && tur < n; i--) {
    sonuc.unshift(kayit[i]);
    if (kayit[i].rol === 'oyuncu') tur++;
  }
  return sonuc;
}

function istemKur(hamleKaydi, sinir) {
  const { son, ilgili, gecmisSiniri } = sinir;
  const yakin = sonTurlar(hamleKaydi, son);
  const yakinSet = new Set(yakin);
  const eski = S.kanon.filter(k => k.ozet && !yakinSet.has(k) && k !== hamleKaydi);

  const b = [];
  b.push('### [1] ÇERÇEVE\n' + cerceve());
  b.push('### [2] KAİDE\n' + S.kaide.map((k, i) => `${i + 1}. ${k.metin}`).join('\n'));
  b.push('### [3] SÖZLÜK\nİzinli terimler:\n' + S.sozluk.izinli.map(s => '- ' + s).join('\n') +
         '\nYasak kelimeler: ' + S.sozluk.yasak.join(', '));
  b.push('### [4] DURUM\n' + JSON.stringify(S.durum, null, 1));

  const gecmis = gecmisSiniri ? eski.slice(-gecmisSiniri) : eski;
  b.push('### [5] GEÇMİŞ (özet)\n' + (gecmis.length ? gecmis.map(k => `- ${k.tarih || ''} — ${k.ozet}`).join('\n') : '(yok)'));

  // §9(b) etiket eşleşmesi — hamlede geçen adlar eski sahnelerin etiketleriyle
  const hs = ' ' + sade(hamleKaydi.metin).replace(/[^a-z0-9' ]/g, ' ') + ' ';
  const puanli = eski.map(k => {
    let p = 0;
    for (const et of (k.etiket || [])) {
      const e = sade(et).replace(/[^a-z0-9' ]/g, ' ').trim();
      if (e.length >= 3 && hs.includes(' ' + e)) p++;
    }
    return { k, p };
  }).filter(x => x.p > 0).sort((a, b) => b.p - a.p || b.k.sira - a.k.sira).slice(0, ilgili);
  b.push('### [6] İLGİLİ SAHNELER\n' + (puanli.length
    ? puanli.map(({ k }) => `- ${k.tarih || ''} — ${k.ozet} [etiket: ${(k.etiket || []).join(', ')}]` +
        (k.degisim && k.degisim.length ? ` [değişim: ${k.degisim.map(d => d.yazi).join('; ')}]` : '')).join('\n')
    : '(eşleşme yok)'));

  b.push('### [7] SON SAHNELER\n' + (yakin.length
    ? yakin.map(k => k.rol === 'oyuncu' ? `[OYUNCU HAMLESİ]\n${k.metin}` : `[SAHNE ${k.sira} — ${k.tarih || ''}]\n${k.metin}`).join('\n\n')
    : '(henüz sahne yok — kampanya açılıyor)'));

  const z = hamleKaydi.zar;
  b.push('### [8] ZAR\n' + (z && z.atildi
    ? `Bu turun zarı: d20 = ${z.d20}. Bu sayıyı DEĞİŞTİRME, yeniden atma, yok sayma. Sahnede tek satırda artı-eksileriyle göster.`
    : 'Bu tur zar atılmadı. Zar sayısı uydurma; sonucu belirsiz bir iş varsa hamlenin makul ve kesin sonucunu anlat ya da sonucu askıda bırak.'));
  b.push('### [9] HAMLE\n' + hamleKaydi.metin);
  return b.join('\n\n');
}

async function modelCagir({ istem, sistem = SISTEM, derinlik = 'normal', azami = 3000, parca = () => {}, tur = 'sahne' }) {
  const yol = erisimYolu();
  if (yol === 'yok') throw new Error('Anlatıcıya erişim yok. Ayar bölümünden Anthropic API anahtarını gir ya da sınama anlatıcısını seç.');
  if (yol === 'sinama') return sinamaAnlaticisi(istem, parca, tur);
  if (yol === 'ortam') {
    const t = String(await window.claude.complete(sistem + '\n\n' + istem));
    for (let i = 0; i < t.length; i += 24) { parca(t.slice(0, i + 24)); await new Promise(r => setTimeout(r, 8)); }
    return t;
  }
  const model = S.ayar.modeller[derinlik] || S.ayar.modeller.normal;
  const yanit = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiAnahtari(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model, max_tokens: azami, stream: true, system: sistem, messages: [{ role: 'user', content: istem }] })
  });
  if (!yanit.ok) {
    let m = yanit.status + ' ' + yanit.statusText;
    try { const j = await yanit.json(); if (j.error && j.error.message) m = j.error.message; } catch (e) {}
    throw new Error('Anlatıcı cevap vermedi: ' + m);
  }
  const okuyucu = yanit.body.getReader();
  const coz = new TextDecoder();
  let tampon = '', metin = '';
  for (;;) {
    const { value, done } = await okuyucu.read();
    if (done) break;
    tampon += coz.decode(value, { stream: true });
    let i;
    while ((i = tampon.indexOf('\n')) >= 0) {
      const satir = tampon.slice(0, i).trim(); tampon = tampon.slice(i + 1);
      if (!satir.startsWith('data:')) continue;
      const veri = satir.slice(5).trim();
      if (!veri || veri === '[DONE]') continue;
      let o; try { o = JSON.parse(veri); } catch (e) { continue; }
      if (o.type === 'content_block_delta' && o.delta && o.delta.type === 'text_delta') { metin += o.delta.text; parca(metin); }
      else if (o.type === 'error') throw new Error('Anlatıcı hatası: ' + ((o.error && o.error.message) || 'bilinmiyor'));
    }
  }
  return metin;
}

/* Sınama anlatıcısı: ağsız deneme ve kabul ölçütleri için. Hamlede
   #ölü #itibar #zimmet #bozuk #zarhile #yasak komutlarını tanır. */
async function sinamaAnlaticisi(istem, parca, tur) {
  let t;
  if (tur === 'kural') {
    const itiraz = ((istem.split('OYUNCUNUN İTİRAZI:')[1] || '').split('\n')[0] || '').trim().replace(/[.。]+$/, '');
    t = itiraz ? `Sahne şu hatayı tekrar etmez: ${itiraz}.` : 'Karakter, oyuncunun yazmadığı bir şeyi yapmaz.';
  } else {
    const zm = istem.match(/d20 = (\d+)/);
    const d = zm ? +zm[1] : null;
    const hamle = (istem.split('### [9] HAMLE\n')[1] || '').trim();
    const devlet = /"olcek": "devlet"/.test(istem);
    const durumBolumu = (istem.split('### [4] DURUM')[1] || '').split('### [5]')[0];
    const tarih = (durumBolumu.match(/"tarih": "([^"]*)"/) || [])[1] || '';
    const mevki = (durumBolumu.match(/"mevki": "([^"]*)"/) || [])[1] || '';
    const var_ = k => hamle.includes(k);
    const temiz = hamle.replace(/#\S+/g, '').trim() || 'Beklemek';
    let m = `Poyraz gece yarısından sonra döndü; tentenin kenarı ıslak bir el gibi omza vurdu. ${devlet ? 'Divanda mumlar yarıya inmişti.' : 'Nimet\'in kıçında fener bir tutuşup bir sönüyordu.'}\n\n`;
    m += `Hamle yazıldığı gibi yürüdü: “${temiz.slice(0, 160)}”. Kemal kalemi mürekkebe batırdı, bir şey sormadı; soracağını yüzünden okudu insan.\n\n`;
    if (var_('#yasak')) m += 'Bir dakika sonra herkes yerindeydi.\n\n';
    if (d != null) {
      const yazilan = var_('#zarhile') ? (d === 20 ? 1 : d + 1) : d;
      const top = yazilan + 1;
      const net = top <= 5 ? 'başarısız, üstüne bir bedel' : top <= 10 ? 'başarısız ama kapı kapanmaz' : top <= 14 ? 'başarılı, bedelli' : top <= 19 ? 'başarılı' : 'beklenenden fazlası';
      m += `(Zar ${yazilan} + 1 hesap = ${top} → ${net})\n\n`;
    }
    m += 'Vardar Ali tokmağı dizine koydu. "Şimdi ne yazalım?" dedi. Sıra sende.';
    const degisim = devlet
      ? [{ alan: 'istikrar', islem: '+1', sebep: 'sınama' }, { alan: 'hazine', islem: '-10', sebep: 'sınama' }]
      : [{ alan: 'itibar.Kubad Reis', islem: '+2', sebep: 'sınama' }, { alan: 'kese', islem: '-1', sebep: 'sınama' }];
    if (var_('#ölü')) degisim.push({ alan: 'adamlar', islem: 'ekle:Yakup Kara — geri gelen kürekçi', sebep: 'sınama' });
    if (var_('#itibar')) degisim.push({ alan: 'itibar.Çoban Mustafa Paşa', islem: '+40', sebep: 'sınama' });
    if (var_('#zimmet')) degisim.push({ alan: 'zimmet', islem: 'sil:Nimet', sebep: 'sınama' });
    degisim.push({ alan: 'uydurma', islem: '+99', sebep: 'şemada olmayan alan' });
    const blok = var_('#bozuk')
      ? '<<<DURUM>>>\n{ "ozet": "bozuk blok, "degisim": [\n<<<SON>>>'
      : '<<<DURUM>>>\n' + JSON.stringify({ ozet: 'Sınama sahnesi: ' + temiz.slice(0, 60), etiket: ['Kemal', 'Vardar Ali', 'Nimet'], tarih, mevki, degisim, kaide_onerisi: null }, null, 2) + '\n<<<SON>>>';
    t = m + '\n\n' + blok;
  }
  for (let i = 0; i < t.length; i += 14) { parca(t.slice(0, i + 14)); await new Promise(r => setTimeout(r, 6)); }
  parca(t);
  return t;
}

/* ---------------------------------------------------------------------
   AYRIŞTIRMA (§6) ve HAKEM (§7)
   --------------------------------------------------------------------- */
function gorunenMetin(t) {
  const i = t.indexOf('<<<DURUM');
  if (i >= 0) return t.slice(0, i);
  const m = t.match(/<{1,3}(?:D(?:U(?:R(?:U(?:M)?)?)?)?)?$/);
  return m ? t.slice(0, m.index) : t;
}

function ayristir(tam) {
  const i = tam.indexOf('<<<DURUM>>>');
  if (i < 0) return { sahne: tam.trim(), blok: null };
  const sahne = tam.slice(0, i).trim();
  let govde = tam.slice(i + 11);
  const s = govde.indexOf('<<<SON>>>');
  if (s >= 0) govde = govde.slice(0, s);
  govde = govde.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try { const blok = JSON.parse(govde); return { sahne, blok: (blok && typeof blok === 'object') ? blok : null }; }
  catch (e) { return { sahne, blok: null }; }
}

function netice(t) {
  if (t <= 5) return 'basarisiz_bedelli';
  if (t <= 10) return 'basarisiz_kapi_acik';
  if (t <= 14) return 'basarili_bedelli';
  if (t <= 19) return 'basarili';
  return 'fazlasi';
}
const NETICE_ADI = { basarisiz_bedelli: 'başarısız, bedelli', basarisiz_kapi_acik: 'başarısız, kapı açık', basarili_bedelli: 'başarılı, bedelli', basarili: 'başarılı', fazlasi: 'beklenenden fazlası' };

function haritaAnahtari(harita, ad) {
  const s = sade(ad);
  return Object.keys(harita).find(k => sade(k) === s) || null;
}
function listeBul(liste, metin) {
  const a = anahtar(metin), s = sade(metin);
  let i = liste.findIndex(x => anahtar(x) === a || sade(x) === s);
  if (i < 0 && a.length >= 3) i = liste.findIndex(x => anahtar(x).startsWith(a) || sade(x).includes(a));
  return i;
}
const KAYIP_KOKLERI = ['kaybet','kaybol','kayb','kayip','batti','batir','batmis','batan','yandi','yakil','yanmis','zapt','elden cik','el konul','calin','calindi','parcalan','dagil','tesl','alindi','alip goturdu','goturul','terk','karaya oturdu','kirildi','harap'];

function kaybiAcik(sahne, oge) {
  const a = anahtar(oge);
  if (!a) return false;
  const cumleler = sade(sahne).split(/[.!?\n]+/);
  return cumleler.some(c => c.includes(a) && KAYIP_KOKLERI.some(k => c.includes(k)));
}

/* Motorun denetim görevleri — anlatıcıya güvenilmez. */
function hakem(blok, sahne, zar) {
  const d = S.durum;
  const sema = SEMA[d.olcek] || SEMA.kisi;
  const degisim = [], notlar = [], dokunulan = [];
  const turFark = {};
  const kurulum = !!S.kampanya.kurulum;

  // Zar denetimi
  let zarKaydi = { atildi: false };
  if (zar && zar.atildi) {
    zarKaydi = { atildi: true, d20: zar.d20, sonuc: null };
    const m = sahne.match(/(?:\bzar(?!ar)|\bd20)\D{0,12}?(\d{1,2})/i);
    const gecti = new RegExp('(^|\\D)' + zar.d20 + '(\\D|$)').test(sahne);
    if (m && +m[1] !== zar.d20) notlar.push(`anlatıcı zarı ${m[1]} yazdı — esas: d20 · ${zar.d20}`);
    else if (!gecti) notlar.push(`zar metinde geçmedi — esas: d20 · ${zar.d20}`);
    let toplam = zar.d20;
    const satir = sahne.split('\n').find(s => /\bzar(?!ar)|\bd20/i.test(s));
    if (satir && m && +m[1] === zar.d20) {
      const t = satir.match(/=\s*(\d{1,2})/);
      if (t) toplam = +t[1];
    }
    zarKaydi.sonuc = netice(toplam);
  }

  // Sözlük denetimi (anakronizm sayısı)
  const sahneSade = ' ' + sade(sahne) + ' ';
  const yakalanan = [];
  for (const y of (S.sozluk.yasak || [])) {
    if (/\(/.test(y)) continue; // bağlama bağlı olanlar (saat (âlet), kaptan (unvan)) motor tarafından sayılmaz
    const k = sade(y);
    if (!k) continue;
    const re = new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (re.test(sahneSade)) yakalanan.push(y);
  }
  if (yakalanan.length) notlar.push('sözlük: yasak kelime geçti — ' + yakalanan.join(', '));

  if (!blok) {
    notlar.push('durum okunamadı');
    return { degisim, notlar, zar: zarKaydi, ozet: '', etiket: [], dokunulan, kaideOnerisi: null };
  }

  if (typeof blok.tarih === 'string' && blok.tarih.trim()) d.tarih = blok.tarih.trim().slice(0, 120);
  if (typeof blok.mevki === 'string' && blok.mevki.trim()) d.mevki = blok.mevki.trim().slice(0, 160);

  const sayiOku = islem => {
    const m = String(islem).trim().replace(/−/g, '-').match(/^([+\-=])\s*(-?\d+(?:[.,]\d+)?)/);
    if (!m) return null;
    return { op: m[1], n: Math.round(parseFloat(m[2].replace(',', '.'))) };
  };

  const puanUygula = (kap, ad, islem, etiket, anahtarAdi) => {
    const s = sayiOku(islem); if (!s) return;
    const onceki = kap[ad];
    const eski = typeof onceki === 'number' ? onceki : 50;
    let hedef = s.op === '+' ? eski + s.n : s.op === '-' ? eski - s.n : s.n;
    if (onceki === undefined && s.op === '=') { kap[ad] = Math.max(0, Math.min(100, hedef)); degisim.push({ yazi: `${etiket} ${kap[ad]} (yeni)`, yon: 'notr' }); dokunulan.push(anahtarAdi); return; }
    let fark = hedef - eski;
    const onceFark = turFark[anahtarAdi] || 0;
    if (!kurulum) {
      const kalanUst = ITIBAR_SINIRI - onceFark, kalanAlt = -ITIBAR_SINIRI - onceFark;
      if (fark > kalanUst || fark < kalanAlt) {
        const kirpik = Math.max(kalanAlt, Math.min(kalanUst, fark));
        notlar.push(`${etiket}: ${isaret(fark)} önerildi — ±${ITIBAR_SINIRI}'e kırpıldı (${isaret(kirpik)})`);
        fark = kirpik;
      }
    }
    let yeni = Math.max(0, Math.min(100, eski + fark));
    fark = yeni - eski;
    turFark[anahtarAdi] = onceFark + fark;
    if (fark === 0 && onceki !== undefined) return;
    kap[ad] = yeni;
    degisim.push({ yazi: `${etiket} ${isaret(fark)}`, yon: fark > 0 ? 'arti' : fark < 0 ? 'eksi' : 'notr' });
    dokunulan.push(anahtarAdi);
  };

  for (const dg of (Array.isArray(blok.degisim) ? blok.degisim : [])) {
    if (!dg || typeof dg.alan !== 'string' || typeof dg.islem !== 'string') continue;
    const nokta = dg.alan.indexOf('.');
    const kok = (nokta >= 0 ? dg.alan.slice(0, nokta) : dg.alan).trim().toLowerCase();
    const alt = nokta >= 0 ? dg.alan.slice(nokta + 1).trim() : '';
    const islem = dg.islem.trim();

    if (sema.sayi[kok]) {
      const s = sayiOku(islem); if (!s) continue;
      const eski = typeof d[kok] === 'number' ? d[kok] : 0;
      let yeni = s.op === '+' ? eski + s.n : s.op === '-' ? eski - s.n : s.n;
      if (yeni < 0) { notlar.push(`${sema.sayi[kok]} sıfırın altına inemez — 0'da durdu`); yeni = 0; }
      if (yeni === eski) continue;
      d[kok] = yeni;
      degisim.push({ yazi: `${sema.sayi[kok]} ${isaret(yeni - eski)}`, yon: yeni > eski ? 'arti' : 'eksi' });
      dokunulan.push(kok);
    }
    else if (sema.olcekli[kok]) {
      const kap = { [kok]: d[kok] };
      puanUygula(kap, kok, islem, sema.olcekli[kok], kok);
      if (kap[kok] !== undefined) d[kok] = kap[kok];
    }
    else if (sema.harita[kok]) {
      if (!alt) continue;
      if (!d[kok] || typeof d[kok] !== 'object') d[kok] = {};
      const kap = d[kok];
      const ad = haritaAnahtari(kap, alt) || alt;
      if (sema.harita[kok] === 'puan') { puanUygula(kap, ad, islem, ad, `${kok}.${sade(ad)}`); continue; }
      // metin haritası (beden, maharet, ordu, vaziyet)
      if (/^sil\b/i.test(islem)) {
        if (kap[ad] === undefined) continue;
        delete kap[ad];
        degisim.push({ yazi: `${ad}: kalktı`, yon: kok === 'beden' ? 'arti' : 'notr' });
      } else {
        const m = islem.match(/^(?:=|ekle:)\s*([\s\S]+)$/i);
        if (!m) continue;
        const deger = m[1].trim().slice(0, 200);
        if (kap[ad] === deger) continue;
        kap[ad] = deger;
        degisim.push({ yazi: `${ad}: ${deger}`, yon: kok === 'beden' ? 'eksi' : kok === 'maharet' ? 'arti' : 'notr' });
      }
      dokunulan.push(`${kok}.${sade(ad)}`);
    }
    else if (sema.liste.includes(kok)) {
      if (!Array.isArray(d[kok])) d[kok] = [];
      const liste = d[kok];
      const m = islem.match(/^(ekle|sil)\s*:\s*([\s\S]+)$/i);
      if (!m) continue;
      const tur = m[1].toLowerCase(), metin = m[2].trim().slice(0, 220);
      const et = sema.etiket[kok];
      if (tur === 'ekle') {
        if (kok === 'adamlar') {
          const olu = (d.oluler || []).find(o => anahtar(o) === anahtar(metin));
          if (olu) { notlar.push(`"${metin.split(/\s+[—–-]\s+/)[0]}" ölüler defterinde — adamlara eklenemez`); continue; }
        }
        if (liste.some(x => anahtar(x) === anahtar(metin))) continue;
        liste.push(metin);
        if (kok === 'oluler') {
          const ai = (d.adamlar || []).findIndex(x => anahtar(x) === anahtar(metin));
          if (ai >= 0) d.adamlar.splice(ai, 1);
        }
        degisim.push({ yazi: `${et}: + ${metin.split(/\s+[—–-]\s+/)[0]}`, yon: kok === 'oluler' ? 'eksi' : kok === 'acik' ? 'notr' : 'arti' });
      } else {
        if (kok === 'oluler') { notlar.push('ölen ölür — ölüler defterinden silme reddedildi'); continue; }
        const i = listeBul(liste, metin);
        if (i < 0) continue;
        if (sema.korunan.includes(kok) && !kaybiAcik(sahne, liste[i])) {
          notlar.push(`${et}: "${liste[i].split(/\s+[—–-]\s+/)[0]}" silinmedi — kaybı sahnede açıkça geçmiyor`);
          continue;
        }
        const giden = liste.splice(i, 1)[0];
        degisim.push({ yazi: `${et}: − ${giden.split(/\s+[—–-]\s+/)[0]}`, yon: kok === 'acik' ? 'arti' : 'eksi' });
      }
      dokunulan.push(kok);
    }
    // şemada olmayan alan: sessizce yok sayılır
  }

  const ozet = typeof blok.ozet === 'string' ? blok.ozet.trim().slice(0, 400) : '';
  const etiket = Array.isArray(blok.etiket) ? blok.etiket.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean).slice(0, 20) : [];
  const kaideOnerisi = typeof blok.kaide_onerisi === 'string' && blok.kaide_onerisi.trim() ? blok.kaide_onerisi.trim().slice(0, 300) : null;
  return { degisim, notlar, zar: zarKaydi, ozet, etiket, dokunulan, kaideOnerisi };
}

/* ---------------------------------------------------------------------
   TUR DÖNGÜSÜ (§4)
   --------------------------------------------------------------------- */
let mesgul = false;
let canli = null; // { kayit, metin }
let sonDokunulan = new Set();

function sonrakiSira() { return S.kanon.reduce((m, k) => Math.max(m, k.sira || 0), 0) + 1; }

async function turCevir() {
  if (mesgul) return;
  const alan = $('#hamle');
  const metin = alan.value.trim();
  if (!metin) { alan.focus(); return; }
  const zar = S.ayar.zar ? { atildi: true, d20: 1 + Math.floor(Math.random() * 20) } : { atildi: false };
  const kayit = { id: 'o' + Date.now(), sira: sonrakiSira(), rol: 'oyuncu', tarih: S.durum.tarih, metin, zar };
  S.kanon.push(kayit);                      // 2. hamle kanona
  depoYaz();
  alan.value = ''; boyAyarla();
  $('#son-zar').textContent = zar.atildi ? `d20 · ${zar.d20}` : 'd20 · —';
  yapiskan = true;
  cizAkis();
  await anlat(kayit);
}

async function anlat(hamleKaydi) {
  mesgul = true; girisKilit(true);
  delete hamleKaydi.hata;
  const durumOnce = kopya(S.durum);
  const { istem, adim } = istemButceli(hamleKaydi);      // 4. bağlam
  console.groupCollapsed(`Defterhane — tur istemi (${istem.length} karakter; son ${adim.son}, ilgili ${adim.ilgili}${adim.gecmisSiniri ? ', geçmiş ' + adim.gecmisSiniri : ''})`);
  console.log(istem);
  console.groupEnd();

  canli = { kayit: hamleKaydi, metin: '' };
  cizAkis();
  let tam;
  try {
    tam = await modelCagir({ istem, derinlik: S.ayar.derinlik, azami: S.ayar.derinlik === 'derin' ? 4000 : S.ayar.derinlik === 'hizli' ? 1800 : 3000,
      parca: t => { canli.metin = t; canliGuncelle(); } });   // 5. tek istek
  } catch (e) {
    hamleKaydi.hata = e.message || String(e);
    canli = null; mesgul = false; girisKilit(false);
    depoYaz(); cizAkis();
    return;
  }
  canli = null;
  const { sahne, blok } = ayristir(tam);                                 // 6. ayrıştır
  const h_ = hakem(blok, sahne || '(anlatıcı boş döndü)', hamleKaydi.zar); // 7. doğrula ve uygula
  const kayit = {
    id: 's' + Date.now(), sira: sonrakiSira(), rol: 'gm', tarih: S.durum.tarih,
    metin: sahne || '(anlatıcı boş döndü)', ozet: h_.ozet || (sahne || '').replace(/\s+/g, ' ').slice(0, 140),
    etiket: h_.etiket, zar: h_.zar, degisim: h_.degisim, notlar: h_.notlar, durumOnce,
    kaideOnerisi: h_.kaideOnerisi || undefined
  };
  S.kanon.push(kayit);
  if (S.kampanya.kurulum) S.kampanya.kurulum = false;
  sonDokunulan = new Set(h_.dokunulan);
  depoYaz();                                                             // 8. kalıcı depo
  mesgul = false; girisKilit(false);
  cizHepsi();                                                            // 9. panel ve hâmiş
}

function girisKilit(k) {
  $('#gonder').disabled = k;
  $('#gonder').textContent = k ? 'Anlatılıyor…' : 'Gönder';
}

/* ---------------------------------------------------------------------
   ÖĞRENME DÖNGÜSÜ (§8)
   --------------------------------------------------------------------- */
const acikItiraz = new Map(); // sahne id → { adim, itiraz, oneri }

async function kuralUret(sahneKaydi, itiraz) {
  const istem = `Bu itirazı, bundan sonraki BÜTÜN turlarda geçerli olacak tek satırlık genel bir kurala dönüştür. Emir kipinde, kısa, denetlenebilir. Bu sahneye değil, tekrar eden davranışa bak. Yalnız kuralı yaz.

İTİRAZ EDİLEN SAHNE (kısaltılmış):
${sahneKaydi.metin.slice(0, 2500)}

OYUNCUNUN İTİRAZI: ${itiraz}

MEVCUT KAİDE (tekrar etme):
${S.kaide.map((k, i) => `${i + 1}. ${k.metin}`).join('\n')}`;
  const t = await modelCagir({ istem, sistem: 'Kısa ve kesin yaz. Yalnız tek satırlık kuralı döndür.', derinlik: 'hizli', azami: 200, tur: 'kural' });
  return t.split('\n').map(s => s.trim()).filter(Boolean)[0].replace(/^[-*\d.)\s"“]+/, '').replace(/["”]+$/, '').trim();
}

function kaideyeEkle(metin, kaynak) {
  S.kaide.push({ id: 'k' + Date.now(), metin, kaynak, tarih: bugun() });
  depoYaz(); cizKaide();
  bildir(`Kaide ${S.kaide.length}. madde eklendi — sonraki turun istemine girecek.`);
  if (S.kaide.length > KAIDE_SINIRI) setTimeout(() => bildir('Kaide şişti, gözden geçir.', 5000), 3300);
}

   ÇİZİM
   --------------------------------------------------------------------- */
const akis = $('#akis');
let yapiskan = true;
akis.addEventListener('scroll', () => { yapiskan = akis.scrollHeight - akis.scrollTop - akis.clientHeight < 80; }, { passive: true });
function asagi() { if (yapiskan) akis.scrollTop = akis.scrollHeight; }

function hamisCiz(k) {
  const hm = h('div', { class: 'hamis', 'aria-label': 'Hâmiş' });
  hm.append(h('span', { class: 't' }, k.tarih || ''));
  if (k.zar && k.zar.atildi) hm.append(h('span', { class: 'zar' }, `d20 · ${k.zar.d20}` + (k.zar.sonuc ? ` — ${NETICE_ADI[k.zar.sonuc] || ''}` : '')));
  for (const d of (k.degisim || [])) hm.append(h('span', { class: d.yon || 'notr' }, d.yazi));
  for (const n of (k.notlar || [])) hm.append(h('span', { class: 'not' }, 'hakem: ' + n));

}

function sahneCiz(k) {
  const kutu = h('article', { class: 'yaprak', 'data-id': k.id });
  const kart = h('div', { class: 'sahne' });
  kart.append(hamisCiz(k));
  const mt = h('div', { class: 'metin' }); mt.innerHTML = sahneHtml(k.metin);
  kart.append(mt);
  kutu.append(kart);
  const alt = h('div', { class: 'sahne-alt' },
    h('button', { class: 'alt-dg', type: 'button', onclick: () => { acikItiraz.set(k.id, { adim: 'yaz', itiraz: '', oneri: '' }); cizAkis(false); } }, 'Bu yanlıştı'));
  kutu.append(alt);
  if (k.kaideOnerisi) {
    kutu.append(h('div', { class: 'itiraz' },
      h('label', null, 'Anlatıcının kaide önerisi (onaysız eklenmez):'),
      h('div', { class: 'oneri' }, k.kaideOnerisi),
      h('div', { class: 'satir' },
        h('button', { class: 'dg ana kucuk', type: 'button', onclick: () => { kaideyeEkle(k.kaideOnerisi, 'duzeltme'); delete k.kaideOnerisi; depoYaz(); cizAkis(false); } }, 'Kaideye ekle'),
        h('button', { class: 'dg kucuk', type: 'button', onclick: () => { delete k.kaideOnerisi; depoYaz(); cizAkis(false); } }, 'Reddet'))));
  }
  const it = acikItiraz.get(k.id);
  if (it) kutu.append(itirazCiz(k, it));
  return kutu;
}

function itirazCiz(k, it) {
  const kapat = () => { acikItiraz.delete(k.id); cizAkis(false); };
  if (it.adim === 'yaz' || it.adim === 'bekle') {
    const ta = h('textarea', { class: 'alan', rows: 2, placeholder: 'Ne yanlıştı? (ör. "Paşa diye hitap etti, o bir reis")' });
    ta.value = it.itiraz;
    const gon = h('button', { class: 'dg ana kucuk', type: 'button', disabled: it.adim === 'bekle' }, it.adim === 'bekle' ? 'Kural yazılıyor…' : 'Kurala dönüştür');
    gon.addEventListener('click', async () => {
      const itiraz = ta.value.trim(); if (!itiraz) { ta.focus(); return; }
      it.itiraz = itiraz; it.adim = 'bekle'; cizAkis(false);
      try { it.oneri = await kuralUret(k, itiraz); it.adim = 'onay'; }
      catch (e) { it.adim = 'yaz'; bildir(e.message || String(e), 6000); }
      cizAkis(false);
    });
    setTimeout(() => { if (it.adim === 'yaz') ta.focus(); }, 0);
    return h('div', { class: 'itiraz' }, h('label', null, 'Bu sahnede ne yanlıştı?'), ta,
      h('div', { class: 'satir' }, gon, h('button', { class: 'dg kucuk', type: 'button', onclick: kapat }, 'Vazgeç')));
  }
  // onay adımı — öneri oyuncuya gösterilir; onaylamadan kaideye düşmez
  const oneri = h('textarea', { class: 'alan', rows: 2 }); oneri.value = it.oneri;
  return h('div', { class: 'itiraz' },
    h('label', null, 'Önerilen kural — düzeltebilirsin. Onaylarsan kaideye girer:'), oneri,
    h('div', { class: 'satir' },
      h('button', { class: 'dg ana kucuk', type: 'button', onclick: () => {
        const m = oneri.value.trim(); if (!m) return;
        k.duzeltmeler = (k.duzeltmeler || []).concat({ itiraz: it.itiraz, kural: m, onay: true, tarih: bugun() });
        kaideyeEkle(m, 'duzeltme'); acikItiraz.delete(k.id); depoYaz(); cizAkis(false);
      } }, 'Onayla, kaideye ekle'),
      h('button', { class: 'dg kucuk', type: 'button', onclick: () => {
        k.duzeltmeler = (k.duzeltmeler || []).concat({ itiraz: it.itiraz, kural: oneri.value.trim(), onay: false, tarih: bugun() });
        depoYaz(); kapat();
      } }, 'Reddet')));
}

function cizAkis(kaydir = true) {
  const ust = akis.scrollTop;
  akis.replaceChildren();
  const tohum = S.kanon.filter(k => k.rol === 'tohum');
  if (tohum.length) {
    akis.append(h('details', { class: 'tohum' },
      h('summary', null, `Önceki defter — ${tohum.length} kayıt (özet)`),
      h('ol', null, tohum.map(k => h('li', null, h('span', null, k.tarih + ' · '), k.ozet)))));
  }
  const kayit = oyuncuVeGmKayitlari();
  if (!kayit.length && !canli) {
    akis.append(h('div', { class: 'acilis' },
      S.kampanya.senaryo === 'balaban'
        ? 'Defter 12 Kasım 1522\'de, Rodos önlerinde açık duruyor. Nizam henüz bitmedi. İlk hamleni yaz.'
        : 'Defter açık. İlk hamleni yaz — oyunu başlat, ulusunu ve liderini söyle; anlatıcı ilk durum raporunu verecek.'));
  }
  for (const k of kayit) {
    if (k.rol === 'oyuncu') {
      akis.append(h('div', { class: 'hamle' }, h('span', { class: 'kim' }, 'Hamle'), k.metin));
      if (k.hata && !(canli && canli.kayit === k)) {
        akis.append(h('div', { class: 'hata-kutu', role: 'alert' },
          h('span', null, k.hata),
          h('button', { class: 'dg kucuk', type: 'button', disabled: mesgul, onclick: () => { if (!mesgul) anlat(k); } }, 'Tekrar dene')));
      }
      if (canli && canli.kayit === k) {
        const kutu = h('article', { class: 'yaprak', id: 'canli' });
        const kart = h('div', { class: 'sahne' });
        kart.append(h('div', { class: 'hamis' }, h('span', { class: 't' }, S.durum.tarih),
          k.zar && k.zar.atildi ? h('span', { class: 'zar' }, `d20 · ${k.zar.d20}`) : null));
        kart.append(h('div', { class: 'metin imlec', id: 'canli-metin' }));
        kutu.append(kart);
        akis.append(kutu);
      }
    } else {
      akis.append(sahneCiz(k));
    }
  }
  if (kaydir) asagi(); else akis.scrollTop = ust;
  if (canli) canliGuncelle();
}

/* ---------------------------------------------------------------------
   KAMPANYA AÇILIŞI (Ek E)
   --------------------------------------------------------------------- */
function kampanyaAc(anahtarAdi, f) {
  const ayar = S.ayar;
  if (anahtarAdi === 'balaban') { S = balabanKampanyasi(ayar); sonDokunulan = new Set(); depoYaz(); cizHepsi(); bildir('Balaban Vekâyinâmesi açıldı.'); return; }
  const s = SENARYOLAR[anahtarAdi];
  const olcek = s.olcek || f.olcek || 'devlet';
  const tarih = f.tarih || s.tarih || '';
  const ad = f.ad || (olcek === 'devlet' ? 'Adsız devlet' : 'Adsız karakter');
  const durum = olcek === 'devlet'
    ? { olcek, tarih, mevki: f.mevki || '', kisi: ad, unvan: f.lider || '', hazine: 0, istikrar: 50, prestij: 50, gruplar: {}, diplomasi: {}, ordu: {}, vaziyet: {}, adamlar: [], kaynak: [], emanet: [], acik: [], oluler: [] }
    : { olcek, tarih, mevki: f.mevki || '', kisi: ad, unvan: f.lider || '', kese: 0, beden: {}, maharet: {}, itibar: {}, adamlar: [], zimmet: [], emanet: [], acik: [], oluler: [] };
  const kaide = TOHUM_KAIDE.map((m, i) => ({ id: 'k' + (i + 1), metin: CAG_KAIDE_DEGISIM[i] || m, kaynak: 'tohum', tarih: bugun() }));
  const senaryoMetni = anahtarAdi === 'kendi' ? (f.metin || '(oyuncu senaryosu verilmedi)') : s.metin;
  S = {
    v: 1,
    kampanya: {
      ad, senaryo: anahtarAdi, kurulum: true,
      kunye: `Senaryo: ${s.ad}\n${senaryoMetni}\n\nOyuncunun ${olcek === 'devlet' ? 'devleti' : 'karakteri'}: ${ad}${f.lider ? ' — ' + f.lider : ''}. Başlangıç: ${tarih || '(oyuncu belirleyecek)'}${f.mevki ? ', ' + f.mevki : ''}.\nİlk tur kuruluş turudur: DURUM boştur; başlangıç değerlerini "=değer" ve "ekle:" işlemleriyle önerirsin (bu turda ±${ITIBAR_SINIRI} sınırı uygulanmaz). Sonraki turlarda sınır geçerlidir.`
    },
    durum, durumTohum: kopya(durum), kaide,
    sozluk: { izinli: [], yasak: (s.yasak || []).slice() },
    kanon: [], ayar
  };
  sonDokunulan = new Set();
  depoYaz(); cizHepsi();
  $('#hamle').value = olcek === 'devlet'
    ? `Oyunu başlat. Ulusum: ${ad}${f.lider ? ', liderim: ' + f.lider : ''}${tarih ? ', başlangıç: ' + tarih : ''}. Dünyanın bana bilinen hâlini anlat ve ilk durum raporunu ver.`
    : `Oyunu başlat. Ben ${ad}${f.lider ? ', ' + f.lider : ''}${tarih ? '; tarih ' + tarih : ''}${f.mevki ? ', ' + f.mevki : ''}. İlk sahneyi aç.`;
  boyAyarla();
  bildir('Yeni kampanya açıldı. İlk hamle hazır; gözden geçirip gönder.');
}

/* ---------------------------------------------------------------------
   KANON İŞLEMLERİ
   --------------------------------------------------------------------- */
function sonTuruSil() {
  if (mesgul) return bildir('Anlatıcı yazarken silinemez.');
  const kayit = oyuncuVeGmKayitlari();
  if (!kayit.length) return bildir('Silinecek tur yok.');
  const son = kayit[kayit.length - 1];
  if (son.rol === 'gm') {
    if (son.durumOnce) S.durum = kopya(son.durumOnce);   // itibar, kese, yara — hepsi eski hâline
    S.kanon.splice(S.kanon.indexOf(son), 1);
    const onceki = oyuncuVeGmKayitlari().slice(-1)[0];
    if (onceki && onceki.rol === 'oyuncu') {
      S.kanon.splice(S.kanon.indexOf(onceki), 1);
      $('#hamle').value = onceki.metin; boyAyarla();
    }
  } else {
    S.kanon.splice(S.kanon.indexOf(son), 1);
    $('#hamle').value = son.metin; boyAyarla();
  }
  sonDokunulan = new Set();
  depoYaz(); cizHepsi();
  bildir('Son tur silindi; durum geri yüklendi. Hamle yazı kutusuna geri kondu.');
}

function sahneleriSil() {
  if (mesgul) return;
  S.kanon = S.kanon.filter(k => k.rol === 'tohum');
  S.durum = kopya(S.durumTohum || S.durum);
  if (S.kampanya.senaryo !== 'balaban') S.kampanya.kurulum = true;
  sonDokunulan = new Set();
  depoYaz(); cizHepsi();
  bildir('Sahneler silindi; kaide ve sözlük korundu.');
}

function hepsiniSifirla() {
  if (mesgul) return;
  S = balabanKampanyasi(S.ayar);
  sonDokunulan = new Set();
  depoYaz(); cizHepsi();
  bildir('Her şey sıfırlandı.');
}

/* ---------------------------------------------------------------------
   DIŞA AKTARMA — veri hapsi yok
   --------------------------------------------------------------------- */
function indir(ad, icerik, tur) {
  const b = new Blob([icerik], { type: tur });
  const u = URL.createObjectURL(b);
  const a = h('a', { href: u, download: ad });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function dosyaAdi(uzanti) {
  return (S.kampanya.ad || 'defterhane').toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + bugun() + '.' + uzanti;
}

function markdownUret() {
  const d = S.durum, L = [];
  const liste = (b, arr) => { L.push(`### ${b}`); (arr && arr.length ? arr : ['—']).forEach(x => L.push(`- ${x}`)); L.push(''); };
  const harita = (b, o) => { L.push(`### ${b}`); const e = Object.entries(o || {}); (e.length ? e : [['—', '']]).forEach(([k, v]) => L.push(`- **${k}**${v !== '' ? ': ' + v : ''}`)); L.push(''); };
  L.push(`# ${S.kampanya.ad} — Vekâyinâme`, '');
  L.push(`_Defterhane'den dışa aktarıldı: ${bugun()}_`, '');
  L.push('## Durum', '');
  L.push(`- **${d.olcek === 'devlet' ? 'Devlet' : 'Kişi'}:** ${d.kisi || ''}`);
  if (d.unvan) L.push(`- **${d.olcek === 'devlet' ? 'Yönetici' : 'Unvan'}:** ${d.unvan}`);
  L.push(`- **Tarih:** ${d.tarih || ''}`, `- **Mevki:** ${d.mevki || ''}`);
  if (d.olcek === 'devlet') {
    L.push(`- **Hazine:** ${d.hazine ?? 0}`, `- **İstikrar:** ${d.istikrar ?? ''}`, `- **Prestij:** ${d.prestij ?? ''}`, '');
    harita('İç gruplar', d.gruplar); harita('Diplomasi', d.diplomasi); harita('Ordu', d.ordu); harita('Vaziyet', d.vaziyet);
    liste('Saray ve danışmanlar', d.adamlar); liste('Kaynaklar', d.kaynak); liste('Antlaşmalar ve vaatler', d.emanet);
  } else {
    L.push(`- **Kese:** ${d.kese ?? 0} akçe`, '');
    harita('Beden', d.beden); harita('Maharet', d.maharet);
    L.push('### İtibar', '', '| Kişi | İtibar |', '|---|---:|');
    Object.entries(d.itibar || {}).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => L.push(`| ${k} | ${v} |`));
    L.push('');
    liste('Adamlar', d.adamlar); liste('Zimmet', d.zimmet); liste('Emanetler ve borçlar', d.emanet);
  }
  liste('Açık meseleler', d.acik); liste('Ölüler', d.oluler);
  L.push('## Kronoloji', '');
  for (const k of S.kanon) {
    if (k.rol === 'tohum') { L.push(`### ${k.sira}. ${k.tarih}`, '', k.ozet, ''); continue; }
    if (k.rol === 'oyuncu') { L.push(`> **Hamle:** ${k.metin.replace(/\n/g, '\n> ')}`, ''); continue; }
    L.push(`### ${k.sira}. ${k.tarih || ''}`, '');
    const hm = [];
    if (k.zar && k.zar.atildi) hm.push(`d20 · ${k.zar.d20}${k.zar.sonuc ? ' (' + NETICE_ADI[k.zar.sonuc] + ')' : ''}`);
    (k.degisim || []).forEach(x => hm.push(x.yazi));
    if (hm.length) L.push(`_Hâmiş: ${hm.join(' · ')}_`, '');
    L.push(k.metin, '');
  }
  L.push('## Kaide', '');
  S.kaide.forEach((k, i) => L.push(`${i + 1}. ${k.metin}${k.kaynak === 'duzeltme' ? ' _(düzeltme)_' : ''}`));
  L.push('', '## Sözlük', '');
  S.sozluk.izinli.forEach(s => L.push(`- ${s}`));
  L.push(`- **Yasak:** ${S.sozluk.yasak.join(', ')}`, '');
  return L.join('\n');
}

/* ---------------------------------------------------------------------
   ÇEKMECELER, KLAVYE, GÖRÜNÜM ALANI
   --------------------------------------------------------------------- */
let acikCekmece = null, oncekiOdak = null;
function cekmeceAc(id) {
  cekmeceKapat(false);
  const c = document.getElementById(id);
  if (id === 'c-kaide') cizKaide();
  if (id === 'c-kanon') cizKanon();
  if (id === 'c-ayar') cizAyar();
  oncekiOdak = document.activeElement;
  c.classList.add('acik'); $('#ortu').classList.remove('gizli');
  acikCekmece = c;
  setTimeout(() => { const f = c.querySelector('button,textarea,input,select'); if (f) f.focus({ preventScroll: true }); }, 30);
}
function cekmeceKapat(odakDon = true) {
  document.querySelectorAll('.cekmece.acik, #panel.acik').forEach(e => e.classList.remove('acik'));
  $('#ortu').classList.add('gizli');
  acikCekmece = null;
  if (odakDon && oncekiOdak && oncekiOdak.focus) oncekiOdak.focus();
}

function boyAyarla() {
  const t = $('#hamle');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight + 2, window.innerHeight * 0.3) + 'px';
}

/* Mobil klavye: yükseklik görünür alana göre düzeltilir; sayfa bütünü kaymaz. */
function gorunumDuzelt() {
  const app = $('#app');
  const vv = window.visualViewport;
  if (vv) {
    app.style.height = vv.height + 'px';
    app.style.transform = `translateY(${vv.offsetTop}px)`;
  } else {
    app.style.height = window.innerHeight + 'px';
  }
  if (window.scrollY) window.scrollTo(0, 0);
  if (app.scrollLeft || app.scrollTop) { app.scrollLeft = 0; app.scrollTop = 0; }
  asagi();
}

/* ---------------------------------------------------------------------
   BAŞLAT
   --------------------------------------------------------------------- */
function baslat() {
  const eski = depoOku();
  if (eski && eski.v === 1 && eski.durum && Array.isArray(eski.kanon)) {
    S = eski;
    S.ayar = Object.assign(varsayilanAyar(), S.ayar || {});
    S.ayar.modeller = Object.assign(varsayilanAyar().modeller, S.ayar.modeller || {});
  } else {
    S = balabanKampanyasi();
  }
  // Yarıda kalmış istek: son hamlenin cevabı yoksa tekrar denenebilir hâle getir.
  const son = oyuncuVeGmKayitlari().slice(-1)[0];
  if (son && son.rol === 'oyuncu' && !son.hata) son.hata = 'Bu hamlenin cevabı tamamlanmadan sayfa kapandı.';
  depoYaz();
  cizHepsi();

  if (!DEPO_VAR) bildir('Kalıcı depo kullanılamıyor: sekme kapanınca oyun kaybolur. Dışa aktarmayı unutma.', 8000);
  else if (!S.ayar.depoBildirildi) {
    bildir('Oyun bu tarayıcının yerel deposunda (localStorage) saklanıyor. Yedek için Ayar → Yedek al.', 7000);
    S.ayar.depoBildirildi = true; depoYaz();
  }

  $('#giris-form').addEventListener('submit', e => { e.preventDefault(); turCevir(); });
  $('#hamle').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); turCevir(); } });
  $('#hamle').addEventListener('input', boyAyarla);
  $('#zar-at').addEventListener('change', e => { S.ayar.zar = e.target.checked; depoYaz(); });
  $('#derinlik').addEventListener('change', e => { S.ayar.derinlik = e.target.value; depoYaz(); });
  document.querySelectorAll('[data-cekmece]').forEach(b => b.addEventListener('click', () => cekmeceAc(b.dataset.cekmece)));
  document.querySelectorAll('[data-kapat]').forEach(b => b.addEventListener('click', () => cekmeceKapat()));
  $('#ortu').addEventListener('click', () => cekmeceKapat());
  $('#dg-durum').addEventListener('click', () => {
    cekmeceKapat(false); oncekiOdak = document.activeElement;
    $('#panel').classList.add('acik'); $('#ortu').classList.remove('gizli');
    $('#panel').setAttribute('tabindex', '-1'); $('#panel').focus({ preventScroll: true });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (acikCekmece || $('#panel').classList.contains('acik'))) cekmeceKapat(); });
  $('#kaide-ekle').addEventListener('submit', e => {
    e.preventDefault();
    const t = $('#kaide-yeni'); const m = t.value.trim(); if (!m) return t.focus();
    t.value = ''; kaideyeEkle(m, 'elle');
  });
  ikiBasis($('#dg-son-sil'), sonTuruSil);
  ikiBasis($('#dg-sahne-sil'), sahneleriSil);
  ikiBasis($('#dg-sifirla'), hepsiniSifirla);
  $('#dg-disa').addEventListener('click', () => { indir(dosyaAdi('md'), markdownUret(), 'text/markdown;charset=utf-8'); bildir('Vekâyinâme Markdown olarak indirildi.'); });
  $('#dg-json-al').addEventListener('click', () => indir(dosyaAdi('json'), JSON.stringify(S, null, 2), 'application/json'));
  $('#json-yukle').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      if (!o || o.v !== 1 || !o.durum || !Array.isArray(o.kanon) || !Array.isArray(o.kaide)) throw new Error('biçim tanınmadı');
      o.ayar = Object.assign(varsayilanAyar(), S.ayar);
      S = o; sonDokunulan = new Set(); depoYaz(); cizHepsi(); cekmeceKapat();
      bildir('Yedek yüklendi.');
    } catch (er) { bildir('Yedek okunamadı: ' + er.message, 5000); }
    e.target.value = '';
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', gorunumDuzelt);
    window.visualViewport.addEventListener('scroll', gorunumDuzelt);
  }
  window.addEventListener('resize', gorunumDuzelt);
  gorunumDuzelt();
  boyAyarla();
}

// Sınama ve konsoldan erişim için
window.Defterhane = { get durum() { return S; }, istemButceli, hakem, ayristir, markdownUret };
baslat();
</script>
</body>
