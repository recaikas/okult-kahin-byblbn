# Hamsi Koyu — Android deneme APK'sı (imzasız debug; telefona elle kurulur, mağazaya yüklenemez).
# Bu dala her push'ta ya da Actions › "Hamsi Koyu — APK" › Run workflow ile çalışır.
# APK: çalışmanın sayfasında Artifacts › hamsi-koyu-apk.
name: Hamsi Koyu — APK
on:
  push:
    branches: [claude/hamsi-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Derleme araçlarını kur (terser, javascript-obfuscator)
        working-directory: balikci-tycoon
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capacitor bağımlılıkları + web dosyaları
        working-directory: balikci-tycoon/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: APK derle (debug)
        working-directory: balikci-tycoon/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HamsiKoyu-2.26.2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hamsi-koyu-apk
          path: HamsiKoyu-2.26.2.apk
