# Hamsi Koyu'yu (eski adı Balıkçı Tycoon) GitHub Pages'te herkese açık yayınlar.
# Bir kez: Settings › Pages › Build and deployment › Source: "GitHub Actions".
# Sonra main'e her push'ta (yalnız balikci-tycoon/ değişince) site güncellenir.
# Adres: https://recaikas.github.io/okult-kahin-byblbn/
name: Hamsi Koyu — Pages
on:
  push:
    branches: [main]
    paths: ['balikci-tycoon/**', '.github/workflows/balikci-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: balikci-tycoon/package-lock.json
      - name: Derleme araçlarını kur (terser, javascript-obfuscator)
        working-directory: balikci-tycoon
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Dosya listesi build-site.js içinde (SITE_FILES + fonts/, art/) — eski cp listesiyle aynı.
      # .js küçültülür + hafif karartılır (isimler korunur: HKG.v), HTML yorumları silinir. Kaynak haritası yok.
      - name: Oyun dosyalarını topla (küçült + karart)
        working-directory: balikci-tycoon
        run: node build-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: balikci-tycoon/_site
      - id: deploy
        uses: actions/deploy-pages@v4
