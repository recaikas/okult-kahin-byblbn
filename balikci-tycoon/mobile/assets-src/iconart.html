<!doctype html><html><head><meta charset="utf-8"><link href="../../fonts/fonts.css" rel="stylesheet"></head><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
/* Balıkçı Tycoon simge/açılış çizimi — 32×32 mantıksal piksel, tam sayı ölçekle büyütülür (keskin pixel art). */
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function drawBg(g) {
  px(g, 0, 0, 32, 32, '#1d6c8f');
  for (let y = 18; y < 32; y += 3) for (let x = (y % 2) * 2; x < 32; x += 6) px(g, x, y, 3, 1, '#2f8aad');
  /* tente */
  for (let i = 0; i < 8; i++) px(g, i * 4, 0, 4, 7, i % 2 ? '#f4f0e4' : '#b5432f');
  for (let i = 0; i < 8; i++) px(g, i * 4 + 1, 7, 2, 1, i % 2 ? '#f4f0e4' : '#b5432f');
  px(g, 0, 7, 32, 0, '#000');
  /* iskele tahtaları */
  px(g, 0, 27, 32, 5, '#ab7a48'); for (let x = 0; x < 32; x += 5) px(g, x, 27, 1, 5, '#6f4526'); px(g, 0, 27, 32, 1, '#c9975f');
}
function drawFish(g) {
  const B = '#cfd8dd', D = '#8fa7b3', L = '#f4f8fa', O = '#e8762b';
  /* gövde */
  px(g, 8, 13, 13, 7, B); px(g, 10, 12, 9, 1, B); px(g, 10, 20, 9, 1, B); px(g, 6, 14, 2, 5, B);
  px(g, 8, 17, 13, 3, D); px(g, 10, 20, 9, 1, D);
  px(g, 10, 13, 9, 1, L);
  /* kuyruk */
  px(g, 21, 12, 2, 9, O); px(g, 23, 10, 2, 4, O); px(g, 23, 19, 2, 4, O); px(g, 22, 15, 2, 3, '#c95a1a');
  /* yüzgeç + göz + ağız */
  px(g, 13, 10, 4, 2, O); px(g, 13, 20, 3, 2, O);
  px(g, 9, 14, 2, 2, '#1d1d24'); px(g, 9, 14, 1, 1, '#ffffff'); px(g, 6, 17, 2, 1, '#8a3a2a');
  /* pul çizgileri */
  for (let x = 12; x < 20; x += 3) px(g, x, 15, 1, 2, D);
  /* altın para */
  px(g, 24, 3, 5, 5, '#ffc94a'); px(g, 25, 2, 3, 1, '#ffc94a'); px(g, 25, 8, 3, 1, '#c9952f'); px(g, 26, 4, 1, 3, '#c9952f');
}
window.render = function (mode, size) {
  const c = document.getElementById('c'), g = c.getContext('2d'); c.width = size; c.height = size; g.imageSmoothingEnabled = false;
  const tmp = document.createElement('canvas'); tmp.width = 32; tmp.height = 32; const t = tmp.getContext('2d');
  if (mode === 'bg' || mode === 'full') drawBg(t);
  if (mode === 'fg' || mode === 'full') drawFish(t);
  if (mode === 'splash' || mode === 'splash-dark') {
    g.fillStyle = mode === 'splash' ? '#1d6c8f' : '#0d3f55'; g.fillRect(0, 0, size, size);
    drawBg(t); drawFish(t);
    const s = Math.floor(size * 0.28 / 32), ox = Math.round(size / 2 - 16 * s), oy = Math.round(size / 2 - 22 * s);
    g.drawImage(tmp, 0, 0, 32, 32, ox, oy, 32 * s, 32 * s);
    g.fillStyle = '#ffc94a'; g.textAlign = 'center'; g.font = 'bold ' + Math.round(size * 0.055) + 'px "Pixelify Sans"';
    g.fillText('BALIKÇI TYCOON', size / 2, oy + 32 * s + size * 0.09);
    return c.toDataURL('image/png');
  }
  if (mode === 'fg') { /* uyarlanır simge: ön plan güvenli alan içinde (orta %66) */
    const s = Math.floor(size * 0.6 / 32), o = Math.round((size - 32 * s) / 2); g.drawImage(tmp, 0, 0, 32, 32, o, o, 32 * s, 32 * s); return c.toDataURL('image/png'); }
  g.drawImage(tmp, 0, 0, 32, 32, 0, 0, size, size); return c.toDataURL('image/png');
};
</script></body></html>
