<!doctype html>
<html><head><meta charset="utf-8"><title>Hamsi Koyu — fragman sahne motoru</title>
<style>
  @font-face{font-family:"Pixelify Sans";src:url("../../../fonts/pixelify-latin.woff2") format("woff2");font-weight:400 700}
  html,body{margin:0;background:#000;overflow:hidden;width:1920px;height:1080px}
  #c{position:absolute;left:0;top:136px;width:1920px;height:808px;image-rendering:pixelated}
  #ov{position:absolute;inset:0;font-family:"Pixelify Sans",monospace}
  .t{position:absolute;left:0;right:0;text-align:center;color:#fff1c9;white-space:nowrap;text-shadow:4px 4px 0 #1a0f08,-2px 0 0 #1a0f08,2px 0 0 #1a0f08,0 -2px 0 #1a0f08}
  #black{position:absolute;inset:0;background:#000;opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<canvas id="c" width="480" height="202"></canvas>
<div id="ov"><div id="tx"></div><div id="flash"></div><div id="black"></div></div>
<script>
'use strict';
const W = 480, H = 202, HOR = 105, WL = 150;           /* ufuk çizgisi, su yüzeyi (kesit) */
const cv = document.getElementById('c'), g = cv.getContext('2d'), img = g.createImageData(W, H), B = img.data;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), mix = (a, b, u) => a + (b - a) * u, sm = x => x * x * (3 - 2 * x);
const mixC = (a, b, u) => [mix(a[0], b[0], u), mix(a[1], b[1], u), mix(a[2], b[2], u)];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const vnoise = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi); return mix(mix(hash(xi, yi), hash(xi + 1, yi), xf), mix(hash(xi, yi + 1), hash(xi + 1, yi + 1), xf), yf); };
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;

/* ---------- piksel ilkelleri (kamera: cam.x, cam.y dünya → ekran; s tam sayı ölçek) ---------- */
let cam = { x: 0, y: 0, s: 1 };
function put(x, y, c, a = 1) {
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 4;
  if (a >= 1) { B[i] = c[0]; B[i + 1] = c[1]; B[i + 2] = c[2]; B[i + 3] = 255; }
  else { B[i] = B[i] + (c[0] - B[i]) * a; B[i + 1] = B[i + 1] + (c[1] - B[i + 1]) * a; B[i + 2] = B[i + 2] + (c[2] - B[i + 2]) * a; B[i + 3] = 255; }
}
const dput = (x, y, c, a) => { if (a > bay(x | 0, y | 0)) put(x, y, c, 1); };      /* "sınırlı saydamlık": dither ile solma */
const wx = x => Math.round((x - cam.x) * cam.s + W / 2), wy = y => Math.round((y - cam.y) * cam.s + H / 2);
function rect(x, y, w, h, c, a = 1) { const X = wx(x), Y = wy(y), ww = Math.max(1, Math.round(w * cam.s)), hh = Math.max(1, Math.round(h * cam.s)); for (let j = Math.max(0, Y); j < Math.min(H, Y + hh); j++) for (let i = Math.max(0, X); i < Math.min(W, X + ww); i++) put(i, j, c, a); }
function drect(x, y, w, h, c, a) { const X = wx(x), Y = wy(y), ww = Math.max(1, Math.round(w * cam.s)), hh = Math.max(1, Math.round(h * cam.s)); for (let j = Math.max(0, Y); j < Math.min(H, Y + hh); j++) for (let i = Math.max(0, X); i < Math.min(W, X + ww); i++) dput(i, j, c, a); }
function disc(cx, cy, r, c, a = 1, d = false) { const X = wx(cx), Y = wy(cy), R = r * cam.s; for (let j = Math.floor(Y - R); j <= Y + R; j++) for (let i = Math.floor(X - R); i <= X + R; i++) if ((i - X) ** 2 + (j - Y) ** 2 <= R * R) (d ? dput : put)(i, j, c, a); }
function line(x0, y0, x1, y1, c, th = 1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * cam.s + 1; for (let k = 0; k <= n; k++) { const u = k / n; rect(mix(x0, x1, u), mix(y0, y1, u), th, th, c); } }
function fillRows(y0, y1, fn) { for (let j = Math.max(0, y0); j < Math.min(H, y1); j++) for (let i = 0; i < W; i++) { const c = fn(i, j); if (c) put(i, j, c, c[3] === undefined ? 1 : 1); } }

/* ---------- renk dizgeleri ---------- */
const SKY = {   /* [tepe, orta, ufuk] — gece, şafak, gün, fırtına */
  night: [hex('#060a20'), hex('#0f1840'), hex('#26306a')],
  dawn: [hex('#1a2459'), hex('#8a4f8f'), hex('#ffa45c')],
  day: [hex('#4d86c9'), hex('#8cc0e6'), hex('#ffe3a6')],
  storm: [hex('#0a1119'), hex('#1b2a38'), hex('#34475a')]
};
function skyPal(d, storm) {      /* d: 0 gece → 1 şafak → 2 gün */
  const a = d < 1 ? SKY.night : SKY.dawn, b = d < 1 ? SKY.dawn : SKY.day, u = d < 1 ? d : d - 1;
  const base = [0, 1, 2].map(k => mixC(a[k], b[k], clamp(u)));
  return storm > 0 ? base.map((c, k) => mixC(c, SKY.storm[k], storm)) : base;
}

/* ---------- sahne durumu ---------- */
let SPR = {}, SPRI = {};
const STARS = Array.from({ length: 90 }, (_, i) => ({ x: hash(i, 1) * 480 * 2, y: hash(i, 2) * (HOR - 8), r: hash(i, 3) }));
const GULLS = Array.from({ length: 6 }, (_, i) => ({ x: hash(i, 5) * 700 - 100, y: 20 + hash(i, 6) * 55, v: 5 + hash(i, 7) * 7, ph: hash(i, 8) * 6 }));

function drawSky(t, S) {
  const pal = skyPal(S.d, S.storm), cx = S.sunX, sunY = S.sunY;
  for (let j = 0; j < HOR; j++) {
    const v = j / HOR;
    for (let i = 0; i < W; i++) {
      let c = v < 0.55 ? mixC(pal[0], pal[1], sm(v / 0.55)) : mixC(pal[1], pal[2], sm((v - 0.55) / 0.45));
      /* güneş halesi */
      const dx = (i + cam.x * 0.15 - cx) , dy = (j - sunY), dd = Math.sqrt(dx * dx * 0.35 + dy * dy);
      const glow = Math.exp(-dd / (38 + S.glowR)) * S.glow;
      c = mixC(c, S.glowCol, clamp(glow));
      /* bulutlar: tabanları güneşle aydınlanır */
      const n = fbm((i + cam.x * 0.3 + t * 2.2) / 38, j / 12 + 3);
      const cl = clamp((n - (0.52 - S.cloud * 0.18)) * 6);
      if (cl > 0) {
        const lit = clamp(1 - (j / HOR) * 1.2 + glow * 0.9);
        const cc = mixC(mixC(pal[0], hex('#0a0d1c'), 0.4 + S.storm * 0.4), mixC(S.cloudLit, S.glowCol, 0.4), lit * clamp(S.d * 0.7 + 0.15) * (1 - S.storm * 0.8));
        c = mixC(c, cc, cl * 0.9);
      }
      const q = bay(i, j) - 0.5;
      put(i, j, [c[0] + q * 7, c[1] + q * 7, c[2] + q * 7]);
    }
  }
  /* yıldızlar */
  const sa = clamp(1 - S.d * 1.4) * (1 - S.storm);
  if (sa > 0) STARS.forEach(s => { const tw = 0.55 + 0.45 * Math.sin(t * (1.5 + s.r * 3) + s.r * 20); const x = ((s.x - cam.x * 0.08) % 480 + 480) % 480; dput(x, s.y, [255, 244, 214], sa * tw); if (s.r > 0.85) { dput(x + 1, s.y, [255, 244, 214], sa * tw * 0.7); dput(x, s.y + 1, [255, 244, 214], sa * tw * 0.7); } });
  /* güneş diski */
  if (S.sunVis) { const X = cx - cam.x * 0.15; for (let j = -16; j <= 16; j++) for (let i = -16; i <= 16; i++) if (i * i + j * j <= 15 * 15) { const y = sunY + j; if (y < HOR - 0) put(X + i, y, mixC(hex('#ffe9a8'), hex('#fff6d8'), clamp(1 - Math.hypot(i, j) / 15))); } }
}

function ridge(x, k) { return fbm(x / 70 + k * 31, k * 7) ; }
function drawMountains(t, S) {
  const pal = skyPal(S.d, S.storm), hz = mixC(pal[1], pal[2], 0.35), dark = mixC(hex('#07101f'), hex('#173629'), clamp(S.d / 2));
  const L = [{ k: 1, base: 62, amp: 30, par: 0.12, mixv: 0.55 }, { k: 2, base: 74, amp: 26, par: 0.22, mixv: 0.36 }, { k: 3, base: 86, amp: 20, par: 0.36, mixv: 0.16 }];
  L.forEach((l, li) => {
    const col = mixC(dark, hz, l.mixv * (0.6 + 0.4 * clamp(S.d))), colTop = mixC(col, S.glowCol, clamp(S.d) * 0.14 * (1 - S.storm));
    for (let i = 0; i < W; i++) {
      const x = i + cam.x * l.par, gap = Math.exp(-((((i + cam.x * 0.15) - S.sunX) / 62) ** 2)) * (58 - li * 8), h = l.base - ridge(x, l.k) * l.amp * 1.7 + 10 + gap;
      for (let j = Math.max(0, Math.floor(h)); j < HOR; j++) {
        const edge = j - h < 2 ? colTop : col;
        const fog = Math.max(0, (j - (HOR - 22)) / 22) * (0.5 + li * 0.1);
        put(i, j, edge); if (fog > 0) dput(i, j, hz, fog * 0.9);
      }
    }
  });
  /* köy: sol yamaçta evler, kırmızı çatılar, pencereler gece yanık */
  const winOn = clamp(1 - S.d * 1.1);
  for (let k = 0; k < 14; k++) {
    const hx = 20 + k * 21 + hash(k, 9) * 8 - cam.x * 0.36, hw = 7 + (k % 3) * 2, hy = 79 + Math.abs(Math.sin(k * 1.7)) * 8 - (k % 2) * 3;
    const wall = mixC(hex('#2a2a3d'), hex('#e8dcc0'), clamp(S.d / 1.6) * (1 - S.storm * 0.7)), roof = mixC(hex('#2d1a24'), hex('#a83d2b'), clamp(S.d / 1.6) * (1 - S.storm * 0.6));
    for (let j = 0; j < 6; j++) for (let i = 0; i < hw; i++) put(hx + i, hy + j, wall);
    for (let j = 0; j < 3; j++) for (let i = -1 + j; i < hw + 1 - j; i++) put(hx + i, hy - 3 + j, roof);
    if (winOn > 0.02 && hash(k, 4) > 0.35) put(hx + 2, hy + 2, hex('#ffd98a'), winOn * (0.7 + 0.3 * Math.sin(t * 3 + k)));
    if (winOn > 0.02 && hash(k, 5) > 0.55) put(hx + hw - 3, hy + 2, hex('#ffd98a'), winOn * 0.8);
  }
  /* fener: sağ burun, gece dönen ışık huzmesi */
  const lx = 420 - cam.x * 0.4, ly = 70;
  for (let j = 0; j < 22; j++) for (let i = -3; i <= 3; i++) { const w = 3 - j * 0.05; if (Math.abs(i) <= w) put(lx + i, ly + j, (j % 6 < 3) ? hex('#d9d4c4') : hex('#a83d2b')); }
  rect2(lx - 4, ly - 4, 9, 4, hex('#2b3340')); put(lx, ly - 2, hex('#ffe9a8'));
  const beam = clamp(1 - S.d * 1.2) * (1 - S.storm * 0.2) + S.storm * 0.8;
  if (beam > 0.03) { const ang = Math.sin(t * 0.9) * 0.9; for (let k = 8; k < 150; k++) for (let w = -Math.round(k * 0.09); w <= Math.round(k * 0.09); w++) { const bx = lx + Math.cos(ang) * k * (ang > 0 ? 1 : 1) * (Math.cos(t * 0.9) > 0 ? -1 : -1), by = ly - 2 + w + k * 0.18 * Math.sin(ang) * 0; dput(lx - k * 1.0, ly - 2 + w * 0.8 + k * 0.1 * Math.sin(t * 0.9), [255, 240, 190], beam * 0.45 * (1 - k / 150)); } }
}
function rect2(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, c); }   /* kamerasız ekran dikdörtgeni */

function drawSea(t, S) {        /* ufuk → su yüzeyi: perspektifli uzak deniz */
  const pal = skyPal(S.d, S.storm), refl = pal[2], deep = mixC(hex('#071a33'), hex('#1b6f94'), clamp(S.d / 2) * (1 - S.storm * 0.6)), sx = S.sunX - cam.x * 0.15;
  for (let j = HOR; j < WL + 1; j++) {
    const v = (j - HOR) / (WL - HOR);
    for (let i = 0; i < W; i++) {
      let c = mixC(mixC(refl, deep, 0.25), deep, sm(v));
      /* dalga satırları: uzaklaştıkça sıklaşır */
      const sc = 0.35 + v * 1.8, ph = t * (0.6 + v * 1.2) * (1 + S.storm * 1.6), wv = vnoise((i + cam.x * 0.5) / (7 + v * 26) + ph, j * 1.7);
      const crest = wv > 0.87 - S.storm * 0.14;
      if (crest) c = mixC(c, mixC(refl, [255, 255, 255], 0.2 + S.storm * 0.5), 0.4 * (0.4 + v));
      /* güneş ışıltısı: ufuktan öne doğru genişleyen sütun */
      const dxs = (i - sx) / (3 + v * 20), spark = Math.exp(-dxs * dxs) * S.glint * (hash(i >> 1, j + Math.floor(t * 5)) > 0.8 - v * 0.1 ? 1 : 0);
      c = mixC(c, mixC(c, hex('#ffc27a'), 0.5), Math.exp(-dxs * dxs * 0.25) * S.glint * 0.3 * (1 - v * 0.5));
      if (spark > 0.25) c = mixC(c, hex('#fff2c6'), clamp(spark * 1.4));
      const q = bay(i, j) - 0.5; put(i, j, [c[0] + q * 6, c[1] + q * 6, c[2] + q * 6]);
    }
  }
}
function boat(x, y, sc, c, sail, t, sway) {
  const bob = Math.sin(t * 1.3 + x) * (0.6 + sway), tilt = Math.sin(t * 0.9 + x * 0.3) * sway * 0.6;
  for (let i = -8; i <= 8; i++) for (let j = 0; j < 3; j++) if (Math.abs(i) <= 8 - j) rect(x + i * sc, y + bob + j * sc + tilt * i * 0.1, sc, sc, c);
  for (let j = 0; j < 22; j++) rect(x, y + bob - 22 * sc + j * sc, sc, sc, mixC(c, [0, 0, 0], 0.2));
  if (sail) for (let j = 0; j < 16; j++) for (let i = 1; i < 11 - j * 0.45; i++) rect(x + i * sc, y + bob - 20 * sc + j * sc, sc, sc, sail);
}
function drawBoats(t, S) {
  const dark = mixC(hex('#0b0d1a'), hex('#3a2c2a'), clamp(S.d / 2)), sail = mixC(hex('#171a2c'), hex('#f0e2c0'), clamp(S.d / 1.7) * (1 - S.storm * 0.7));
  boat(190 + Math.sin(t * 0.05) * 3, HOR + 14, 1, dark, sail, t, S.storm);
  boat(330, HOR + 10, 1, dark, sail, t + 3, S.storm);
  boat(400, HOR + 24, 1, dark, null, t + 6, S.storm);
}
function drawGulls(t, S) {
  if (S.gulls <= 0) return;
  GULLS.forEach((gl, i) => { const x = ((gl.x + t * gl.v * 3) % 760) - 140 - cam.x * 0.5, y = gl.y + Math.sin(t * 0.8 + gl.ph) * 6, f = Math.sin(t * 7 + gl.ph) > 0 ? 1 : -1; const c = mixC(hex('#1a1d2c'), hex('#f4f0e6'), clamp(S.d / 1.8)); for (let k = 0; k < 5; k++) { put(x - k, y - (k > 1 ? (k - 1) * 0.6 * f : 0) + (f > 0 ? 0 : k * 0.3), c); put(x + k, y - (k > 1 ? (k - 1) * 0.6 * f : 0) + (f > 0 ? 0 : k * 0.3), c); } put(x, y + 1, c); });
}

/* ---------- kesit: su altı + iskele ---------- */
function drawWater(t, S) {
  const deepY = S.deepY || 0;
  for (let j = Math.max(0, wy(WL)); j < H; j++) {
    const wyv = (j - H / 2) / cam.s + cam.y, depth = clamp((wyv - WL) / 340);
    for (let i = 0; i < W; i++) {
      const wxv = (i - W / 2) / cam.s + cam.x;
      let c = mixC(mixC(hex('#1f8aa0'), hex('#0e4768'), sm(clamp(depth * 3.2))), hex('#02081a'), sm(clamp((depth - 0.2) * 1.4)));
      c = mixC(c, mixC(c, [8, 16, 30], 0.55), S.storm * 0.8);
      /* ışık hüzmeleri: yüzeyden eğik şeritler */
      const ray = Math.max(0, Math.sin((wxv + wyv * 0.6) / 17 + t * 0.35) * Math.sin((wxv + wyv * 0.6) / 43 - t * 0.2)) * (1 - depth * 1.6) * S.rays;
      if (ray > 0) c = mixC(c, hex('#bff3ff'), ray * 0.5);
      /* yüzeye yakın kostik ağı */
      const ca = Math.abs(Math.sin(wxv / 6 + Math.sin(wyv / 5 + t) * 1.2 + t * 0.8)) * Math.abs(Math.sin(wyv / 7 + t * 0.6 + wxv / 23));
      if (depth < 0.2 && ca > 0.9) c = mixC(c, hex('#d6fbff'), (1 - depth / 0.2) * 0.4 * S.rays);
      const q = bay(i, j) - 0.5; put(i, j, [c[0] + q * 7, c[1] + q * 7, c[2] + q * 7]);
    }
  }
  /* su çizgisi: köpüklü dalga */
  for (let i = 0; i < W; i++) { const wxv = (i - W / 2) / cam.s + cam.x, y = WL + Math.sin(wxv / 9 + t * 1.8) * 1.2 * (1 + S.storm * 3) + Math.sin(wxv / 3.7 - t * 2.4) * 0.6 * (1 + S.storm * 3); const sy = wy(y); put(i, sy, [235, 250, 255]); put(i, sy + 1, mixC(hex('#9fe0ee'), [255, 255, 255], 0.3)); if (hash(i, Math.floor(t * 3)) > 0.93) put(i, sy - 1, [255, 255, 255]); }
  /* deniz tabanı kayalık + yosun */
  const floorY = 520;
  for (let i = 0; i < W; i++) { const wxv = (i - W / 2) / cam.s + cam.x, h = floorY - fbm(wxv / 60, 5) * 40; for (let j = Math.max(0, wy(h)); j < H; j++) put(i, j, mixC(hex('#0a1620'), hex('#12202c'), hash(i >> 1, j >> 1))); }
}
function drawPier(t, S) {
  const deck = mixC(hex('#2a1c14'), hex('#8a5a33'), clamp(S.d / 1.5)), deck2 = mixC(deck, [0, 0, 0], 0.25), light = mixC(deck, hex('#d9a441'), 0.35 * clamp(S.d / 1.5));
  const px0 = -40, px1 = S.pierEnd || 290, top = 150;
  /* direkler (su içine) */
  for (let k = 0; k < 8; k++) { const x = px0 + 28 + k * 40; rect(x, top + 6, 5, 140, mixC(hex('#1a120c'), hex('#4a3220'), 0.35 + 0.2 * clamp(S.d)), 1); rect(x, top + 6, 1, 140, mixC(deck, hex('#8a5a33'), 0.4)); for (let j = 0; j < 7; j++) rect(x - 1, top + 22 + j * 18 + hash(k, j) * 4, 7, 2, hex('#0f2a24'), 0.6); }
  /* güverte: tahtalar */
  rect(px0, top - 4, px1 - px0, 4, deck);
  rect(px0, top - 4, px1 - px0, 1, light);
  rect(px0, top, px1 - px0, 7, deck2);
  for (let x = px0; x < px1; x += 14) rect(x, top - 4, 1, 4, deck2);
  for (let x = px0; x < px1; x += 30) rect(x, top, 1, 7, mixC(deck2, [0, 0, 0], 0.4));
  /* halat korkuluk */
  for (let k = 0; k < 7; k++) { const x = px0 + 20 + k * 42; rect(x, top - 15, 3, 11, mixC(hex('#1a120c'), hex('#6b4a2e'), clamp(S.d / 2))); }
  for (let k = 0; k < 6; k++) { const x0 = px0 + 21 + k * 42; for (let i = 0; i < 42; i++) rect(x0 + i, top - 13 + Math.sin(i / 42 * Math.PI) * 2.5, 1, 1, mixC(hex('#3a2c20'), hex('#c9a15e'), clamp(S.d / 2))); }
  /* fener direği + ışık */
  const lx = 60, flick = 0.8 + 0.2 * Math.sin(t * 9) * Math.sin(t * 5.3), lampOn = clamp(1.25 - S.d * 0.9);
  rect(lx, top - 44, 2, 40, hex('#262d38')); rect(lx - 4, top - 52, 10, 8, hex('#262d38'));
  rect(lx - 3, top - 51, 8, 6, mixC(hex('#3a3a2a'), hex('#ffd98a'), clamp(lampOn)));
  if (lampOn > 0.05) { for (let j = -34; j <= 34; j++) for (let i = -44; i <= 44; i++) { const d = Math.hypot(i * 0.8, j); if (d < 40) dput(wx(lx + 1) + i * cam.s * 0, wy(top - 48) + j, [255, 214, 130], (1 - d / 40) * 0.55 * lampOn * flick); } for (let j = -34; j <= 34; j++) for (let i = -44; i <= 44; i++) { const d = Math.hypot(i * 0.8, j); if (d < 40) dput(wx(lx + 1) + i, wy(top - 48) + j, [255, 214, 130], (1 - d / 40) * 0.5 * lampOn * flick); } }
  /* fıçılar, sandıklar, ağ yığını */
  const bar = (x, w, h, c) => { rect(x, top - 4 - h, w, h, c); rect(x, top - 4 - h, w, 1, mixC(c, [255, 255, 255], 0.25)); rect(x, top - 4 - h * 0.7, w, 1, mixC(c, [0, 0, 0], 0.35)); rect(x, top - 4 - h * 0.3, w, 1, mixC(c, [0, 0, 0], 0.35)); };
  bar(98, 12, 14, mixC(hex('#1a120c'), hex('#7a4b26'), clamp(S.d / 1.5))); bar(112, 12, 11, mixC(hex('#1a120c'), hex('#6b3f22'), clamp(S.d / 1.5)));

    if (im) { const k = 4, sw = im.width, sh = im.height, X = Math.round(120 - sw * k / 2 - (1 - e) * 140), Y = 176 - (sh - 3) * k - bob; if (!SPRI[S.card.id + '_d']) { const c = document.createElement('canvas'); c.width = sw; c.height = sh; const gx = c.getContext('2d'); gx.drawImage(im, 0, 0); SPRI[S.card.id + '_d'] = gx.getImageData(0, 0, sw, sh); } const d = SPRI[S.card.id + '_d'].data;
      for (let j = 0; j < sh * k; j++) for (let i = 0; i < sw * k; i++) { const si = ((j / k | 0) * sw + (i / k | 0)) * 4; if (d[si + 3] > 40) put(X + i, Y + j, [d[si], d[si + 1], d[si + 2]]); }
      for (let i = 0; i < 26 * k; i++) for (let j = 0; j < 3; j++) dput(X + 6 * k + i, 176 + j, [0, 0, 0], 0.5 - j * 0.15); }
  }
  drawNet(t, S); drawSplash(t, S);
  if (S.bolt) for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) dput(i, j, [215, 228, 255], 0.22);
  if (S.zoom) zoomCrop(S.zoom.cx, S.zoom.cy, S.zoom.k);
  drawRain(t, S); drawVignette();
  g.putImageData(img, 0, 0);
}

window.ready = (async () => {
  const sp = await (await fetch('sprites.json')).json();
  await Promise.all(Object.entries(sp).map(([k, v]) => new Promise(r => { const im = new Image(); im.onload = () => { SPRI[k] = im; r(); }; im.src = v; })));
  await document.fonts.load('700 40px "Pixelify Sans"');
  return true;
})();
window.render = (scene, t, ov) => {
  if (ov && ov.card) CARD = ov.card;
  compose(scene, t);
  ov = ov || {};
  document.getElementById('black').style.opacity = ov.black || 0; document.getElementById('flash').style.opacity = ov.flash || 0;
  const tx = document.getElementById('tx'); tx.innerHTML = (ov.texts || []).map(o => `<div class="t" style="top:${o.top}px;font:700 ${o.size}px 'Pixelify Sans';letter-spacing:${o.track || 6}px;color:${o.col || '#fff1c9'};opacity:${o.a};transform:translateY(${(1 - o.a) * 14}px) scale(${1 + (o.slam || 0) * 0.4})">${o.s}</div>`).join('');
};
