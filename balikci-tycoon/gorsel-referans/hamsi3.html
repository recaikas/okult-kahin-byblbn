/* AYNI SAHNE, AYNI ORANLAR, ama 2 kat ince piksel (K=2): 294x638 sanat pikseli. Dünya birimi = eski piksel. */
const K=2,W1=147,H1=319,W=W1*K,H=H1*K,S=3;
const buf=new Array(W*H).fill('#000000');
function hash(a,b){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function th(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hx(a),B=hx(b);return th(A.map((v,i)=>v+(B[i]-v)*t))}
function dark(c,t){return mix(c,'#20142a',t)}
function lite(c,t){return mix(c,'#fffbe8',t)}
function P(x,y,c,a=1){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return;const k=y*W+x;buf[k]=a<1?mix(buf[k],c,a):c}

function circ(cx,cy,r,c,a){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*0.6)P(cx+x,cy+y,c,a)}

class Lay{constructor(){this.p=new Map()}
 set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return;this.p.set(y*W+x,c)}

 outline(t=0.6){const add=[];for(const[k,c]of this.p){const x=k%W,y=(k/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=ny*W+nx;if(!this.p.has(nk))add.push([nk,dark(c,t)])}}for(const[k,c]of add)if(!this.p.has(k))this.p.set(k,c);return this}

function isoBox(L,x0,y0,x1,y1,z0,h,f){
 const zt=z0+h;
 const minX=Math.floor(sx(x0,y1))-2,maxX=Math.ceil(sx(x1,y0))+2,minY=Math.floor(sy(x0,y0,zt))-2,maxY=Math.ceil(sy(x1,y1,z0))+2;
 for(let py=Math.max(0,minY);py<=Math.min(H-1,maxY);py++)for(let px=Math.max(0,minX);px<=Math.min(W-1,maxX);px++){
  const u=(px+0.5)/K-OX,v=(py+0.5)/K-OY;

  if(f.top&&X>=x0&&X<x1&&Y>=y0&&Y<y1){L.set(px,py,f.top(X-x0,Y-y0));continue}
  if(h>0){
   X=u+y1;let Z=(X+y1)/2-v;
   if(f.left&&X>=x0&&X<x1&&Z>=z0&&Z<zt){L.set(px,py,f.left(X-x0,Z-z0));continue}
   Y=x1-u;Z=(x1+Y)/2-v;
   if(f.right&&Y>=y0&&Y<y1&&Z>=z0&&Z<zt){L.set(px,py,f.right(Y-y0,Z-z0))}
  }}
 return L}
